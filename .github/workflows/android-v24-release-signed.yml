name: Build Android v26 signed Release

on:
  push:
    branches:
      - android/v24-facebook-admob
      - fix/admob-postmessage-origin
      - fix/admob-twa-verification-v26

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set v26 version code
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/versionCode 22/versionCode 26/' app/build.gradle
          sed -i 's/versionCode 24/versionCode 26/' app/build.gradle
          sed -i 's/versionCode 25/versionCode 26/' app/build.gradle
          grep -q 'versionCode 26' app/build.gradle
      - name: Build signed Release APK and AAB
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Verify Release signing certificate
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$AAB"
      - name: Upload signed Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-release-signed-v26-twa-fix
          path: |
            android-generated/app/build/outputs/apk/release/app-release.apk
            android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore

# v26 CI trigger
