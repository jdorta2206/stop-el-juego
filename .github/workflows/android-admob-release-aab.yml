name: Android AdMob release AAB v83

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirma solo después de revisar master y autorizar la única AAB de Google Play."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require explicit final release approval
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RELEASE" != "true" ]]; then
            echo "::error::La generación de la AAB no está autorizada. Revisa master y confirma expresamente."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::La AAB de publicación solo puede generarse desde master."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set version 1.3.9.7 (code 83) and validate release safeguards
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode [0-9]+/versionCode 83/' app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.3.9.7"/' app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s, count = re.subn(r"launchUrl: '/\?source=googleplay-twa&appVersion=[^']*'", "launchUrl: '/?source=googleplay-twa&appVersion=1.3.9.7'", s, count=1)
          if count != 1:
              raise SystemExit('Bubblewrap launchUrl not found exactly once')
          s, count = re.subn(r'def launchUrl = "https://www\.stopjuegodepalabras\.com/\?source=googleplay-twa&appVersion=[^"]+"', 'def launchUrl = "https://www.stopjuegodepalabras.com/?source=googleplay-twa&appVersion=1.3.9.7"', s, count=1)
          if count != 1:
              raise SystemExit('Android launchUrl resource not found exactly once')
          p.write_text(s)
          PY
          grep -q 'versionCode 83' app/build.gradle
          grep -q 'versionName "1.3.9.7"' app/build.gradle
          grep -q 'appVersion=1.3.9.7' app/build.gradle
          grep -q 'AdsPolicy.isEnabled' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'SSV custom data configured' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'onUserEarnedReward' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'Posting client result' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'private static final boolean ENABLED = true' app/src/main/java/app/replit/stop_el_juego/twa/AdsPolicy.java
          grep -q 'ADMOB_ADS_ENABLED = true' ../artifacts/stop-game/src/lib/admobPolicy.ts
          grep -q 'com.google.android.gms.permission.AD_ID' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'EngagementSignalsCallback' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'onSessionEnded(boolean didUserInteract' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'pendingInteractivePlayGamesSignIn' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'fontWeightAdjustment' app/src/main/AndroidManifest.xml
          grep -q 'grammaticalGender' app/src/main/AndroidManifest.xml
          grep -q 'android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'android.support.customtabs.trusted.SMALL_ICON' app/src/main/AndroidManifest.xml
          grep -q 'extends com.google.androidbrowserhelper.trusted.DelegationService' app/src/main/java/app/replit/stop_el_juego/twa/DelegationService.java
          grep -q 'common.handle_all_urls' ../artifacts/stop-game/public/.well-known/assetlinks.json
          grep -q 'common.use_as_origin' ../artifacts/stop-game/public/.well-known/assetlinks.json
          grep -q 'app.replit.stop_el_juego.twa' ../artifacts/stop-game/public/.well-known/assetlinks.json
          grep -q '30:B6:ED:A1:7B:C3:99:96:4C:51:E5:A6:0D:C4:05:8F:E2:47:A8:2E:CD:3B:07:E3:F5:97:79:F8:2B:97:AB:09' ../artifacts/stop-game/public/.well-known/assetlinks.json
          grep -q 'android:name=".DelegationService"' app/src/main/AndroidManifest.xml
          grep -q 'enableNotifications: true' app/build.gradle
          echo 'Android release, PGS lifecycle and notification delegation source checks: OK'
      - name: Build signed Google Play AAB
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace
      - name: Verify signed AAB and release metadata
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB"
          grep -q 'versionCode 83' app/build.gradle
          grep -q 'versionName "1.3.9.7"' app/build.gradle
          sha256sum "$AAB"
          ls -lh "$AAB"
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-admob-release-v83-1.3.9.7
          path: android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore
