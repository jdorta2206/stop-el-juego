name: Halloween preview
# Preview validation + public tunnel for Halloween testing
# Manual-test refresh: keep a fresh tunnel available for the current Halloween build.

on:
  push:
    branches:
      - feature/halloween-2026
      - feature/halloween-jumpscares-v2
      - feature/halloween-solo-surprise
  pull_request:
    branches:
      - feature/halloween-2026
      - feature/halloween-jumpscares-v2
      - feature/halloween-solo-surprise
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: halloween-preview-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Halloween preview
        env:
          VITE_HALLOWEEN_PREVIEW: 'true'
          VITE_API_URL: ''
        run: pnpm --filter @workspace/stop-game build
      - name: Verify preview build
        run: test -s artifacts/stop-game/dist/index.html
      - name: Start preview server with production API proxy
        run: |
          cat > /tmp/halloween-preview-server.py <<'PY'
          import http.client, os
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from urllib.parse import urlsplit
          DIST=os.path.abspath("artifacts/stop-game/dist"); UPSTREAM="www.stopjuegodepalabras.com"; MAX_REDIRECTS=4
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self,*a,**kw): super().__init__(*a,directory=DIST,**kw)
              def _proxy(self):
                  target=urlsplit(self.path); path=target.path+(( "?" + target.query) if target.query else "")
                  length=int(self.headers.get("Content-Length","0") or "0"); body=self.rfile.read(length) if length else None
                  headers={k:v for k,v in self.headers.items() if k.lower() not in {"host","content-length","origin","referer"}}
                  headers["Host"]=UPSTREAM; headers["X-Halloween-Preview"]="1"; host=UPSTREAM; scheme="https"
                  for _ in range(MAX_REDIRECTS+1):
                      conn=http.client.HTTPSConnection(host,timeout=60)
                      try:
                          conn.request(self.command,path,body=body,headers=headers); resp=conn.getresponse()
                          if resp.status not in {301,302,303,307,308}:
                              self.send_response(resp.status,resp.reason)
                              for k,v in resp.getheaders():
                                  if k.lower() not in {"transfer-encoding","connection","content-encoding","content-length"}: self.send_header(k,v)
                              data=resp.read(); self.send_header("Content-Length",str(len(data))); self.end_headers()
                              if data: self.wfile.write(data); self.wfile.flush()
                              return
                          location=resp.getheader("Location")
                          if not location: self.send_response(resp.status,resp.reason); self.end_headers(); return
                          next_url=urlsplit(location); host=next_url.hostname or host; scheme=next_url.scheme or scheme
                          path=next_url.path+(( "?" + next_url.query) if next_url.query else "")
                          if scheme!="https": self.send_error(502,"Unsupported upstream redirect"); return
                          if next_url.hostname: headers["Host"]=host
                      finally: conn.close()
                  self.send_error(508,"Too many upstream redirects")
              def do_GET(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  return super().do_GET()
              def do_POST(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_PUT(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_PATCH(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_DELETE(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_OPTIONS(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_response(204); self.end_headers()
              def send_error(self,code,message=None,explain=None):
                  if code==404 and not self.path.startswith("/api/"):
                      self.path="/index.html"; return super().do_GET()
                  return super().send_error(code,message,explain)
          os.chdir(DIST); ThreadingHTTPServer(("127.0.0.1",4173),Handler).serve_forever()
          PY
          nohup python3 /tmp/halloween-preview-server.py >/tmp/preview-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Smoke test API validation through preview proxy
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --max-time 60 -H "Content-Type: application/json" -X POST http://127.0.0.1:4173/api/game/validate --data '{"letter":"B","language":"es","playerResponses":[{"category":"Nombre","word":"BARBI"},{"category":"Lugar","word":"BARCELONA"},{"category":"Animal","word":"BURRO"}]}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"playerTotalScore"'
          echo "$RESPONSE" | grep -q '"playerTotalScore":[1-9]'
      - name: Smoke test presence through preview proxy
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 http://127.0.0.1:4173/api/presence/online | grep -q '"online"'
      - name: Smoke test rooms listing through preview proxy
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 http://127.0.0.1:4173/api/rooms/public | grep -q '"rooms"'
      - name: Smoke test room creation through preview proxy
        run: |
          set -euo pipefail
          HOST_ID="halloween-smoke-$(date +%s)-$RANDOM"
          RESPONSE=$(curl -fsS --max-time 30 -H "Content-Type: application/json" -X POST http://127.0.0.1:4173/api/rooms --data "{\"hostId\":\"$HOST_ID\",\"hostName\":\"Halloween Smoke\",\"maxRounds\":1,\"language\":\"es\",\"loginMethod\":\"guest\",\"isPublic\":false,\"gameMode\":\"classic\",\"maxPlayers\":2}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"roomCode"'
      - name: Smoke test public and private room join through preview proxy
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:4173/api"
          HOST_ID="halloween-host-$(date +%s)-$RANDOM"
          GUEST_ID="halloween-guest-$(date +%s)-$RANDOM"
          OUTSIDER_ID="halloween-outsider-$(date +%s)-$RANDOM"

          create_room() {
            local public="$1"
            curl -fsS --max-time 30 -H "Content-Type: application/json" -X POST "$BASE/rooms"               --data "{\"hostId\":\"$HOST_ID\",\"hostName\":\"Halloween Host\",\"maxRounds\":1,\"language\":\"es\",\"loginMethod\":\"guest\",\"isPublic\":$public,\"gameMode\":\"classic\",\"maxPlayers\":2}"
          }

          echo "== PUBLIC: create =="
          PUBLIC_RESPONSE="$(create_room true)"
          echo "$PUBLIC_RESPONSE"
          PUBLIC_CODE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["roomCode"])' <<< "$PUBLIC_RESPONSE")"
          test -n "$PUBLIC_CODE"

          echo "== PUBLIC: second player joins =="
          PUBLIC_JOIN="$(curl -fsS --max-time 30 -H "Content-Type: application/json" -X POST "$BASE/rooms/$PUBLIC_CODE/join"             --data "{\"playerId\":\"$GUEST_ID\",\"playerName\":\"Halloween Guest\",\"avatarColor\":\"#3182ce\",\"picture\":null,\"loginMethod\":\"guest\"}")"
          echo "$PUBLIC_JOIN"
          echo "$PUBLIC_JOIN" | grep -q '"roomCode"'
          echo "$PUBLIC_JOIN" | grep -q 'Halloween Guest'

          echo "== PUBLIC: room contains both players =="
          PUBLIC_ROOM="$(curl -fsS --max-time 30 "$BASE/rooms/$PUBLIC_CODE?viewerId=$HOST_ID")"
          echo "$PUBLIC_ROOM"
          echo "$PUBLIC_ROOM" | grep -q 'Halloween Host'
          echo "$PUBLIC_ROOM" | grep -q 'Halloween Guest'

          echo "== PRIVATE: create =="
          PRIVATE_RESPONSE="$(create_room false)"
          echo "$PRIVATE_RESPONSE"
          PRIVATE_CODE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["roomCode"])' <<< "$PRIVATE_RESPONSE")"
          test -n "$PRIVATE_CODE"

          echo "== PRIVATE: host can read full room =="
          PRIVATE_HOST_ROOM="$(curl -fsS --max-time 30 -H "x-viewer-id: $HOST_ID" "$BASE/rooms/$PRIVATE_CODE")"
          echo "$PRIVATE_HOST_ROOM"
          echo "$PRIVATE_HOST_ROOM" | grep -q 'Halloween Host'

          echo "== PRIVATE: second player joins =="
          PRIVATE_JOIN="$(curl -fsS --max-time 30 -H "Content-Type: application/json" -X POST "$BASE/rooms/$PRIVATE_CODE/join"             --data "{\"playerId\":\"$GUEST_ID\",\"playerName\":\"Halloween Guest\",\"avatarColor\":\"#3182ce\",\"picture\":null,\"loginMethod\":\"guest\"}")"
          echo "$PRIVATE_JOIN"
          echo "$PRIVATE_JOIN" | grep -q '"roomCode"'
          echo "$PRIVATE_JOIN" | grep -q 'Halloween Guest'

          echo "== PRIVATE: second player can read room =="
          PRIVATE_GUEST_ROOM="$(curl -fsS --max-time 30 -H "x-viewer-id: $GUEST_ID" "$BASE/rooms/$PRIVATE_CODE")"
          echo "$PRIVATE_GUEST_ROOM"
          echo "$PRIVATE_GUEST_ROOM" | grep -q 'Halloween Host'
          echo "$PRIVATE_GUEST_ROOM" | grep -q 'Halloween Guest'

          echo "== PRIVATE: outsider is not given full room =="
          PRIVATE_OUTSIDER_STATUS="$(curl -sS --max-time 30 -o /tmp/private-outsider.json -w '%{http_code}' "$BASE/rooms/$PRIVATE_CODE?viewerId=$OUTSIDER_ID")"
          cat /tmp/private-outsider.json
          test "$PRIVATE_OUTSIDER_STATUS" = "200"
          ! grep -q 'Halloween Guest' /tmp/private-outsider.json

      - name: Start public preview tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --logfile /tmp/cloudflared.log --url http://127.0.0.1:4173 >/tmp/cloudflared-stdout.log 2>&1 &
          sleep 8
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[^[:space:]]+trycloudflare[.]com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          test -n "${URL:-}" || { cat /tmp/cloudflared.log; exit 1; }
          echo "HALLOWEEN_PREVIEW_URL=$URL"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          printf '%s\n' "$URL" > /tmp/halloween-preview-url.txt
          {
            echo "## Halloween preview"
            echo
            echo "### 🔗 Preview URL"
            echo
            echo "$URL"
            echo
            echo "Open the URL above to test this preview."
            echo
            echo "Preview stays online while this workflow job is running."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preview URL to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments \
            -d "$(python3 -c 'import json,os; print(json.dumps({"body":"🎃 **Halloween preview URL**\n\n"+os.environ["PREVIEW_URL"]+"\n\nEste enlace permanece activo mientras el workflow esté ejecutándose."}))')"
      - name: Publish preview URL
        uses: actions/upload-artifact@v4
        with:
          name: halloween-preview-url
          path: /tmp/halloween-preview-url.txt
          retention-days: 1
      - name: Keep preview available for manual testing
        run: sleep 10800
      - name: Stop preview processes
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f halloween-preview-server.py || true
