name: Halloween preview
# Preview retrigger: keep manual Halloween preview available
# Auto-triggered validation after tunnel fallback update

on:
  push:
    branches:
      - feature/halloween-2026
      - feature/halloween-jumpscares-v2
      - feature/halloween-solo-surprise
  pull_request:
    branches:
      - feature/halloween-2026
      - feature/halloween-jumpscares-v2
      - feature/halloween-solo-surprise
  workflow_dispatch:


concurrency:
  group: halloween-preview-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20