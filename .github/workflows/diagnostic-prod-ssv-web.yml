name: Diagnostic production web and SSV

on:
  push:
    branches:
      - diagnostic/prod-ssv-web

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current master source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Curl production HTML and bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -sSIL --max-time 30 https://www.stopjuegodepalabras.com/ | sed -n '1,40p'
          curl -sSL --max-time 30 https://www.stopjuegodepalabras.com/ -o /tmp/index.html
          PROD_ASSET="$(grep -oE 'src="/assets/index[^"]+\.js"' /tmp/index.html | sed -E 's/src="//;s/"$//' | head -1)"
          test -n "$PROD_ASSET"
          PROD_URL="https://www.stopjuegodepalabras.com${PROD_ASSET}"
          echo "PROD_ASSET=$PROD_ASSET"
          echo "PROD_URL=$PROD_URL"
          curl -sSL --max-time 30 "$PROD_URL" -o /tmp/prod.js
          sha256sum /tmp/prod.js
          wc -c /tmp/prod.js
          echo "PROD stopad occurrences:"
          grep -oF 'stopad://rewarded' /tmp/prod.js | wc -l
          echo "PROD timeout string occurrences:"
          grep -oF 'Native rewarded ad request timed out' /tmp/prod.js | wc -l

      - name: Build current master web
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm --filter @workspace/stop-game build
          LOCAL_ASSET="$(find artifacts/stop-game/dist/assets -maxdepth 1 -type f -name 'index.*.js' | head -1)"
          test -n "$LOCAL_ASSET"
          echo "LOCAL_ASSET=$LOCAL_ASSET"
          sha256sum "$LOCAL_ASSET"
          wc -c "$LOCAL_ASSET"
          echo "LOCAL stopad occurrences:"
          grep -oF 'stopad://rewarded' "$LOCAL_ASSET" | wc -l
          echo "LOCAL timeout string occurrences:"
          grep -oF 'Native rewarded ad request timed out' "$LOCAL_ASSET" | wc -l

      - name: Compare production bundle with current master build
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_ASSET="$(find artifacts/stop-game/dist/assets -maxdepth 1 -type f -name 'index.*.js' | head -1)"
          PROD_TS="$(sed -nE 's/.*index\.[A-Za-z0-9_-]+\.([0-9]+)\.js.*/\1/p' /tmp/index.html | head -1)"
          LOCAL_TS="$(basename "$LOCAL_ASSET" | sed -nE 's/.*\.([0-9]+)\.js/\1/p')"
          echo "PROD_TS=$PROD_TS"
          echo "LOCAL_TS=$LOCAL_TS"
          sed "s/$PROD_TS/BUILD_TIMESTAMP/g" /tmp/prod.js > /tmp/prod-normalized.js
          sed "s/$LOCAL_TS/BUILD_TIMESTAMP/g" "$LOCAL_ASSET" > /tmp/local-normalized.js
          PROD_SHA="$(sha256sum /tmp/prod-normalized.js | awk '{print $1}')"
          LOCAL_SHA="$(sha256sum /tmp/local-normalized.js | awk '{print $1}')"
          echo "PROD_NORMALIZED_SHA=$PROD_SHA"
          echo "LOCAL_NORMALIZED_SHA=$LOCAL_SHA"
          if [ "$PROD_SHA" = "$LOCAL_SHA" ]; then
            echo "NORMALIZED_BUNDLE_MATCH=YES"
          else
            echo "NORMALIZED_BUNDLE_MATCH=NO"
            exit 3
          fi

      - name: Check production SSV endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SSV URL probe ==="
          curl -sS -o /tmp/ssv-body -w 'HTTP %{http_code}\n' --max-time 30 https://www.stopjuegodepalabras.com/api/rewards/admob-ssv
          cat /tmp/ssv-body
          echo
          echo "=== RESULT STATUS SAMPLE ==="
          curl -sS -o /tmp/result-body -w 'HTTP %{http_code}\n' --max-time 30 https://www.stopjuegodepalabras.com/api/rewards/admob-result/diagnostic-request-id-123456
          cat /tmp/result-body
          echo