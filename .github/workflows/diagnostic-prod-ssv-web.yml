name: Diagnostic production web and SSV

on:
  push:
    branches:
      - diagnostic/prod-ssv-web

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl production HTML and find JS bundles
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PROD HEADERS ==="
          curl -sSIL --max-time 30 https://www.stopjuegodepalabras.com/ | sed -n '1,40p'

          echo "=== PROD HTML ==="
          curl -sSL --max-time 30 https://www.stopjuegodepalabras.com/ -o /tmp/index.html
          wc -c /tmp/index.html
          grep -oE '<script[^>]+src="[^"]+\.js[^"]*"' /tmp/index.html | head -50 || true

          echo "=== JS ASSETS ==="
          grep -oE '/[^"]+\.js[^"]*' /tmp/index.html | sort -u | head -100 || true

          echo "=== isGameTimerPaused IN SERVED HTML ==="
          if grep -Fq 'isGameTimerPaused' /tmp/index.html; then
            echo "FOUND in HTML"
          else
            echo "NOT in HTML"
          fi

          echo "=== DOWNLOAD REFERENCED JS AND SEARCH ==="
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('/tmp/index.html').read_text(errors='ignore')
          assets = sorted(set(re.findall(r'''(?:src|href)="([^"]+\.js[^"]*)"''', html)))
          print("ASSETS", assets)
          base = "https://www.stopjuegodepalabras.com"
          import urllib.request
          found = False
          for asset in assets:
              url = asset if asset.startswith("http") else base + asset
              try:
                  data = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "ignore")
              except Exception as e:
                  print("ERROR", url, e)
                  continue
              print("BUNDLE", url, "BYTES", len(data))
              if "isGameTimerPaused" in data:
                  found = True
                  print("FOUND isGameTimerPaused IN", url)
                  idx = data.find("isGameTimerPaused")
                  print(data[max(0,idx-300):idx+700])
          if not found:
              print("NOT FOUND isGameTimerPaused IN ANY REFERENCED JS")
              raise SystemExit(2)
          PY

      - name: Check production SSV endpoints
        shell: bash
        run: |
          set -u
          echo "=== SSV NO-CUSTOM-DATA ==="
          curl -sS -o /tmp/ssv-body -w 'HTTP %{http_code}\n' --max-time 30             'https://www.stopjuegodepalabras.com/api/rewards/admob-ssv'
          cat /tmp/ssv-body
          echo

          echo "=== RESULT STATUS SAMPLE ==="
          curl -sS -o /tmp/result-body -w 'HTTP %{http_code}\n' --max-time 30             'https://www.stopjuegodepalabras.com/api/rewards/admob-result/diagnostic-request-id-123456'
          cat /tmp/result-body
          echo
