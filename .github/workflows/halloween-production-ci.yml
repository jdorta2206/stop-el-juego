name: Halloween production CI

on:
  pull_request:
    branches: [master]
    paths:
      - "artifacts/stop-game/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/halloween-production-ci.yml"
  push:
    branches: [fix/halloween-production-ready, halloween-2026-final]
  workflow_dispatch:

concurrency:
  group: halloween-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install
        run: pnpm install --frozen-lockfile
      # The API package currently contains a pre-existing TypeScript baseline
      # outside this PR. Do not mask that baseline with unsafe any-casts just to
      # merge telemetry-only changes. Validate the shared typed packages here,
      # then validate the actual production web/API artifacts in the build steps.
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Test
        run: pnpm test
      - name: Build web
        run: pnpm --filter @workspace/stop-game build
      - name: Build API
        run: pnpm --filter @workspace/api-server build
