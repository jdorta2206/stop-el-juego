name: Android rewarded diagnostic AAB

on:
  workflow_dispatch:
  push:
    branches:
      - chore/android-aab-v81
      - fix/android-keep-admob-paused

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set diagnostic version 1.3.9.5 (code 81)
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode [0-9]+/versionCode 81/' app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.3.9.5"/' app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s, count = re.subn(r"launchUrl: '/\?source=googleplay-twa&appVersion=[^']*'", "launchUrl: '/?source=googleplay-twa&appVersion=1.3.9.5'", s, count=1)
          if count != 1:
              raise SystemExit('Bubblewrap launchUrl not found exactly once')
          s, count = re.subn(r'def launchUrl = "https://www\.stopjuegodepalabras\.com/\?source=googleplay-twa&appVersion=[^"]+"', 'def launchUrl = "https://www.stopjuegodepalabras.com/?source=googleplay-twa&appVersion=1.3.9.5"', s, count=1)
          if count != 1:
              raise SystemExit('Android launchUrl resource not found exactly once')
          p.write_text(s)
          PY
          grep -q 'versionCode 81' app/build.gradle
          grep -q 'versionName "1.3.9.5"' app/build.gradle
          grep -q 'appVersion=1.3.9.5' app/build.gradle
          grep -q 'SSV custom data configured' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'onUserEarnedReward' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'Posting client result' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -q 'android:name=".StopApplication"' app/src/main/AndroidManifest.xml
          grep -q 'AdsPolicy.isEnabled' app/src/main/java/app/replit/stop_el_juego/twa/RewardedAdActivity.java
          grep -Fq 'private static final boolean ENABLED = false;' app/src/main/java/app/replit/stop_el_juego/twa/AdsPolicy.java
          echo 'AdMob disabled policy assertion: OK'
          echo 'Rewarded diagnostic Android source checks: OK'
      - name: Build signed Google Play AAB
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace
      - name: Verify signed AAB and version
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB"
          grep -q 'versionCode 81' app/build.gradle
          grep -q 'versionName "1.3.9.5"' app/build.gradle
          sha256sum "$AAB"
          ls -lh "$AAB"
      - name: Upload diagnostic AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: stop-rewarded-diagnostic-aab-v81-1.3.9.5
          path: android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore
