name: Wire AI difficulty
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.head_commit.message != 'chore(ai): wire AI difficulty'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Server: authoritative Premium + elapsed round time. The existing
          # word validation, scoring and anti-cheat code remain untouched.
          replace_once(
              'artifacts/api-server/src/routes/game.ts',
              'import { normalizeWord, isSafeInput } from "../lib/wordRules";\n',
              'import { normalizeWord, isSafeInput } from "../lib/wordRules";\nimport { isUserPremium } from "../lib/premiumStatus";\nimport { createAiRoundPlan, shouldAiAnswer } from "../lib/aiDifficulty";\n'
          )
          p = Path('artifacts/api-server/src/routes/game.ts')
          s = p.read_text(encoding='utf-8')
          marker = 'const playerId = req.header("x-player-id") || req.playerId || "";'
          if 'const aiDifficultyPremium =' not in s:
              if marker not in s:
                  raise SystemExit('server playerId marker not found')
              insert = marker + '\n  const aiDifficultyPremium = playerId ? await isUserPremium(playerId).catch(() => false) : false;\n  const aiElapsedMs = Math.max(0, Math.min(Number((req.body as { roundElapsedMs?: unknown }).roundElapsedMs) || 60000, 120000));\n  const aiPlan = createAiRoundPlan(playerResponses.map(pr => pr.category), aiDifficultyPremium, aiElapsedMs);'
              s = s.replace(marker, insert, 1)
          old = 'const aiWord = getAiWord(letter, pr.category, language);'
          new = 'const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWord(letter, pr.category, language) : "";'
          if new not in s:
              if old not in s:
                  raise SystemExit('server aiWord call not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Request schema + generated request type.
          replace_once(
              'lib/api-zod/src/generated/api.ts',
              '  playerResponses: zod.array(\n',
              '  roundElapsedMs: zod.number().int().min(0).max(120000).optional(),\n  playerResponses: zod.array(\n'
          )
          replace_once(
              'lib/api-zod/src/generated/types/validateRoundRequest.ts',
              '  playerResponses: CategoryResponse[];\n',
              '  roundElapsedMs?: number;\n  playerResponses: CategoryResponse[];\n'
          )
          replace_once(
              'lib/api-client-react/src/generated/api.schemas.ts',
              'export interface ValidateRoundRequest {\n',
              'export interface ValidateRoundRequest {\n  roundElapsedMs?: number;\n'
          )

          # Offline: same deterministic difficulty model, using elapsed time.
          replace_once(
              'artifacts/stop-game/src/lib/offlineGame.ts',
              'import { getApiUrl } from "./utils";\n',
              'import { getApiUrl } from "./utils";\nimport { createAiRoundPlan, shouldAiAnswer } from "./aiDifficulty";\n'
          )
          replace_once(
              'artifacts/stop-game/src/lib/offlineGame.ts',
              '  playerResponses: { category: string; word: string }[];\n',
              '  playerResponses: { category: string; word: string }[];\n  isPremium?: boolean;\n  elapsedMs?: number;\n'
          )
          replace_once(
              'artifacts/stop-game/src/lib/offlineGame.ts',
              '  const { letter, language, playerResponses } = req;\n',
              '  const { letter, language, playerResponses, isPremium = false, elapsedMs = 60000 } = req;\n  const aiPlan = createAiRoundPlan(playerResponses.map(pr => pr.category), isPremium, elapsedMs);\n'
          )
          replace_once(
              'artifacts/stop-game/src/lib/offlineGame.ts',
              '    const aiWord = getAiWordOffline(letter, pr.category, language);\n',
              '    const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWordOffline(letter, pr.category, language) : "";\n'
          )

          # Solo: capture round start and send elapsed time. FTUE remains exactly
          # where it is, after validation, so it is not duplicated.
          p = Path('artifacts/stop-game/src/pages/SoloGame.tsx')
          s = p.read_text(encoding='utf-8')
          if 'roundStartedAtRef' not in s:
              anchor = '  const scoreTokensRef = useRef<string[]>([]);\n'
              if anchor not in s: raise SystemExit('Solo scoreTokens anchor not found')
              s = s.replace(anchor, anchor + '  const roundStartedAtRef = useRef<number>(0);\n', 1)
          if 'roundStartedAtRef.current = Date.now();' not in s:
              anchor = '    setGameState("PLAYING");\n    setTimeLeft(roundTime);\n'
              if anchor not in s: raise SystemExit('Solo startRound anchor not found')
              s = s.replace(anchor, '    roundStartedAtRef.current = Date.now();\n' + anchor, 1)
          if 'roundElapsedMs:' not in s:
              needle = '            playerResponses: formattedResponses,\n'
              if needle not in s: raise SystemExit('Solo online request anchor not found')
              s = s.replace(needle, needle + '            roundElapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current),\n', 1)
          if 'elapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current)' not in s:
              needle = '        playerResponses: formattedResponses,\n      });'
              if needle not in s: raise SystemExit('Solo offline request anchor not found')
              s = s.replace(needle, '        playerResponses: formattedResponses,\n        isPremium,\n        elapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current),\n      });', 1)
          p.write_text(s, encoding='utf-8')

          print('AI difficulty wiring prepared successfully')
      - name: Commit and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/game.ts artifacts/stop-game/src/lib/offlineGame.ts artifacts/stop-game/src/pages/SoloGame.tsx lib/api-zod/src/generated/api.ts lib/api-zod/src/generated/types/validateRoundRequest.ts lib/api-client-react/src/generated/api.schemas.ts artifacts/api-server/src/lib/aiDifficulty.ts artifacts/stop-game/src/lib/aiDifficulty.ts .github/workflows/_wire_ai_difficulty.yml
          git rm .github/workflows/_wire_ai_difficulty.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ai): wire AI difficulty"
          git push