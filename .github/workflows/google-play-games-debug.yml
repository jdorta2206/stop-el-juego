name: Google Play Games integration debug

on:
  push:
    branches:
      - feat/google-play-games-integration
  pull_request:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - 'android-generated/**'
      - 'artifacts/stop-game/src/hooks/useAchievements.ts'
      - 'artifacts/stop-game/src/lib/twaAdBridge.ts'
      - 'docs/GOOGLE_PLAY_GAMES_INTEGRATION.md'
      - '.github/workflows/google-play-games-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-games-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Compile current PGS integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify integration sources and route allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f android-generated/app/src/main/java/app/replit/stop_el_juego/twa/PlayGamesAchievementsActivity.java
          grep -q 'play-services-games-v2:22.1.0' android-generated/app/build.gradle
          grep -q 'stoppgs' android-generated/app/src/main/AndroidManifest.xml
          grep -q 'stoppgs://unlock' artifacts/stop-game/src/lib/twaAdBridge.ts
          grep -q 'handleAchievementUnlock' android-generated/app/src/main/java/app/replit/stop_el_juego/twa/PlayGamesAchievementsActivity.java
          echo "PGS source guards passed."

      - name: Assemble debug APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and fingerprint APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: stop-pgs-integration-debug-${{ github.sha }}
          path: android-generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
