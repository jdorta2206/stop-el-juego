name: Android signed interstitial diagnostic

on:
  push:
    branches:
      - fix/interstitial-signed-diagnostic-v50
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
      - name: Decode production signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set diagnostic version code and force AD_ID
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode [0-9]+/versionCode 50/' app/build.gradle
          grep -q 'versionCode 50' app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />'
          if 'com.google.android.gms.permission.AD_ID' not in s:
              marker = '    <uses-permission android:name="com.android.vending.BILLING" />'
              if marker not in s:
                  raise SystemExit('BILLING permission marker not found')
              s = s.replace(marker, marker + '\n' + perm, 1)
              p.write_text(s)
          if 'com.google.android.gms.permission.AD_ID' not in p.read_text():
              raise SystemExit('AD_ID permission missing before build')
          PY
      - name: Build signed diagnostic APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Verify TWA signing and APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='50'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q 'com.google.android.gms.permission.AD_ID' /tmp/apk-permissions.txt
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload signed diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-interstitial-signed-v50-twa
          path: android-generated/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore

# diagnostic workflow trigger
