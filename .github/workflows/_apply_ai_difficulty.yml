name: Apply AI difficulty wiring
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'chore(ai): wire AI difficulty'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe AI difficulty wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          # Server: authoritative Premium + elapsed time + difficulty gate.
          p = Path('artifacts/api-server/src/routes/game.ts')
          s = p.read_text(encoding='utf-8')
          if 'createAiRoundPlan' not in s:
              s = s.replace('import { normalizeWord, isSafeInput } from "../lib/wordRules";\n', 'import { normalizeWord, isSafeInput } from "../lib/wordRules";\nimport { isUserPremium } from "../lib/premiumStatus";\nimport { createAiRoundPlan, shouldAiAnswer } from "../lib/aiDifficulty";\n', 1)
          if 'const aiDifficultyPremium' not in s:
              anchor = re.search(r'(const playerId =\s*[\s\S]*?;\n)', s)
              if not anchor:
                  raise SystemExit('playerId anchor not found')
              insert = anchor.group(1) + '\n  const aiDifficultyPremium = playerId ? await isUserPremium(playerId).catch(() => false) : false;\n  const aiElapsedMs = Math.max(0, Math.min(Number((req.body as { roundElapsedMs?: unknown }).roundElapsedMs) || 60000, 120000));\n  const aiPlan = createAiRoundPlan(playerResponses.map(pr => pr.category), aiDifficultyPremium, aiElapsedMs);\n'
              s = s[:anchor.start()] + insert + s[anchor.end():]
          old = 'const aiWord = getAiWord(letter, pr.category, language);'
          new = 'const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWord(letter, pr.category, language) : "";'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Request schemas: roundElapsedMs is client telemetry only; Premium remains server-authoritative.
          p = Path('lib/api-zod/src/generated/api.ts')
          s = p.read_text(encoding='utf-8')
          if 'roundElapsedMs: zod.number().int().min(0).max(120000).optional()' not in s:
              s = s.replace('  playerResponses: zod.array(\n', '  roundElapsedMs: zod.number().int().min(0).max(120000).optional(),\n  playerResponses: zod.array(\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/api-zod/src/generated/types/validateRoundRequest.ts')
          s = p.read_text(encoding='utf-8')
          if 'roundElapsedMs?: number;' not in s:
              s = s.replace('  playerResponses: CategoryResponse[];\n', '  roundElapsedMs?: number;\n  playerResponses: CategoryResponse[];\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/api-client-react/src/generated/api.schemas.ts')
          s = p.read_text(encoding='utf-8')
          if 'roundElapsedMs?: number;' not in s:
              # Only the ValidateRoundRequest interface occurrence.
              marker = 'export interface ValidateRoundRequest {\n'
              idx = s.find(marker)
              if idx < 0: raise SystemExit('client ValidateRoundRequest not found')
              pos = s.find('  playerResponses: CategoryResponse[];\n', idx)
              if pos < 0: raise SystemExit('client playerResponses not found')
              s = s[:pos] + '  roundElapsedMs?: number;\n' + s[pos:]
          p.write_text(s, encoding='utf-8')

          # Client offline API: same difficulty model, using elapsed round time.
          p = Path('artifacts/stop-game/src/lib/offlineGame.ts')
          s = p.read_text(encoding='utf-8')
          if 'createAiRoundPlan' not in s:
              # Locate imports conservatively.
              first_import_end = s.find('\n', s.find('import '))
              s = s[:first_import_end+1] + 'import { createAiRoundPlan, shouldAiAnswer } from "./aiDifficulty";\n' + s[first_import_end+1:]
          if 'elapsedMs?: number;' not in s:
              s = s.replace('  playerResponses: { category: string; word: string }[];\n', '  playerResponses: { category: string; word: string }[];\n  isPremium?: boolean;\n  elapsedMs?: number;\n', 1)
          if 'const aiPlan = createAiRoundPlan' not in s:
              s = re.sub(r'(const \{\s*letter,\s*language,\s*playerResponses\s*\}\s*=\s*req;)', r'\1\n  const { isPremium = false, elapsedMs = 60000 } = req;\n  const aiPlan = createAiRoundPlan(playerResponses.map(pr => pr.category), isPremium, elapsedMs);', s, count=1)
          old = 'const aiWord = getAiWordOffline(letter, pr.category, language);'
          new = 'const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWordOffline(letter, pr.category, language) : "";'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # SoloGame: capture round start and send elapsedMs without touching scoring/FTUE.
          p = Path('artifacts/stop-game/src/pages/SoloGame.tsx')
          s = p.read_text(encoding='utf-8')
          if 'roundStartedAtRef' not in s:
              anchor = '  const scoreTokensRef = useRef<string[]>([]);\n'
              if anchor not in s: raise SystemExit('SoloGame ref anchor not found')
              s = s.replace(anchor, anchor + '  const roundStartedAtRef = useRef<number>(0);\n', 1)
          if 'roundStartedAtRef.current = Date.now();' not in s:
              anchor = '    setGameState("PLAYING");\n    setTimeLeft(roundTime);'
              if anchor not in s: raise SystemExit('SoloGame start anchor not found')
              s = s.replace(anchor, '    roundStartedAtRef.current = Date.now();\n' + anchor, 1)
          if 'roundElapsedMs:' not in s:
              needle = '            playerResponses: formattedResponses,\n'
              if needle not in s: raise SystemExit('SoloGame request anchor not found')
              s = s.replace(needle, needle + '            roundElapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current),\n', 1)
          if 'elapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current)' not in s:
              needle = '        playerResponses: formattedResponses,\n      });'
              if needle not in s: raise SystemExit('SoloGame offline anchor not found')
              s = s.replace(needle, '        playerResponses: formattedResponses,\n        isPremium,\n        elapsedMs: Math.max(0, Date.now() - roundStartedAtRef.current),\n      });', 1)
          p.write_text(s, encoding='utf-8')

          print('AI difficulty wiring applied')
      - name: Commit and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/game.ts artifacts/stop-game/src/lib/offlineGame.ts artifacts/stop-game/src/pages/SoloGame.tsx lib/api-zod/src/generated/api.ts lib/api-zod/src/generated/types/validateRoundRequest.ts lib/api-client-react/src/generated/api.schemas.ts .github/workflows/_apply_ai_difficulty.yml
          git rm .github/workflows/_apply_ai_difficulty.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ai): wire AI difficulty"
          git push
