name: Apply AI difficulty
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore(ai): apply difficulty patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patches
        shell: python
        run: |
          from pathlib import Path

          def patch(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(n, encoding='utf-8')

          # Server: difficulty is independent from Premium. Old clients remain
          # compatible because the request schema supplies defaults.
          patch('artifacts/api-server/src/routes/game.ts', lambda s: (
              s.replace(
                  'import { issueScoreToken } from "../lib/scoreToken";\n',
                  'import { issueScoreToken } from "../lib/scoreToken";\nimport { createAiRoundPlan, shouldAiAnswer } from "../lib/aiDifficulty";\n', 1
              ).replace(
                  'const { letter, language, playerResponses } = body.data;',
                  'const { letter, language, playerResponses, elapsedMs, aiDifficulty } = body.data;', 1
              ).replace(
                  '  let aiTotalScore = 0;\n\n  for (const pr of playerResponses) {',
                  '  let aiTotalScore = 0;\n\n  const aiPlan = createAiRoundPlan(\n    playerResponses.map((p) => p.category),\n    aiDifficulty,\n    elapsedMs,\n  );\n\n  for (const pr of playerResponses) {', 1
              ).replace(
                  '    const aiWord = getAiWord(letter, pr.category, language);',
                  '    const aiWord = shouldAiAnswer(aiPlan, pr.category)\n      ? getAiWord(letter, pr.category, language)\n      : "";', 1
              )
          ))

          # Shared API validation schema: defaults preserve existing callers.
          patch('lib/api-zod/src/generated/api.ts', lambda s: s.replace(
              '  playerName: zod.string().optional(),\n  playerResponses:',
              '  playerName: zod.string().optional(),\n  elapsedMs: zod.coerce.number().int().min(0).max(120000).default(60000),\n  aiDifficulty: zod.enum(["easy", "expert"]).default("easy"),\n  playerResponses:', 1
          ))

          patch('lib/api-zod/src/generated/types/validateRoundRequest.ts', lambda s: s.replace(
              '  playerName?: string;\n  playerResponses:',
              '  playerName?: string;\n  elapsedMs?: number;\n  aiDifficulty?: "easy" | "expert";\n  playerResponses:', 1
          ))

          # Offline: same difficulty engine, based on actual elapsed round time.
          patch('artifacts/stop-game/src/lib/offlineGame.ts', lambda s: (
              s.replace(
                  'import { getApiUrl } from "./utils";\n',
                  'import { getApiUrl } from "./utils";\nimport { createAiRoundPlan, shouldAiAnswer, type AiDifficulty } from "./aiDifficulty";\n', 1
              ).replace(
                  '  playerResponses: { category: string; word: string }[];\n};',
                  '  playerResponses: { category: string; word: string }[];\n  elapsedMs?: number;\n  aiDifficulty?: AiDifficulty;\n};', 1
              ).replace(
                  '  const { letter, language, playerResponses } = req;\n',
                  '  const { letter, language, playerResponses } = req;\n  const aiPlan = createAiRoundPlan(\n    playerResponses.map((p) => p.category),\n    req.aiDifficulty ?? "easy",\n    req.elapsedMs ?? 60000,\n  );\n', 1
              ).replace(
                  '    const aiWord = getAiWordOffline(letter, pr.category, language);',
                  '    const aiWord = shouldAiAnswer(aiPlan, pr.category)\n      ? getAiWordOffline(letter, pr.category, language)\n      : "";', 1
              )
          ))

          # Solo: send the real round elapsed time and selected difficulty.
          patch('artifacts/stop-game/src/pages/SoloGame.tsx', lambda s: (
              s.replace(
                  '  const [timeLeft, setTimeLeft] = useState(ROUND_TIME);',
                  '  const [timeLeft, setTimeLeft] = useState(ROUND_TIME);\n  const [aiDifficulty, setAiDifficulty] = useState<"easy" | "expert">("easy");\n  const roundStartedAtRef = useRef<number>(Date.now());', 1
              ).replace(
                  '    setGameState("PLAYING");\n    setTimeLeft(roundTime);',
                  '    setGameState("PLAYING");\n    roundStartedAtRef.current = Date.now();\n    setTimeLeft(roundTime);', 1
              ).replace(
                  '    const formattedResponses = currentCategories.map(cat => ({',
                  '    const elapsedMs = Math.max(0, Date.now() - roundStartedAtRef.current);\n\n    const formattedResponses = currentCategories.map(cat => ({', 1
              ).replace(
                  '            playerName: player?.name,\n            playerResponses: formattedResponses,',
                  '            playerName: player?.name,\n            elapsedMs,\n            aiDifficulty,\n            playerResponses: formattedResponses,', 1
              ).replace(
                  '        playerResponses: formattedResponses,\n      });',
                  '        playerResponses: formattedResponses,\n        elapsedMs,\n        aiDifficulty,\n      });', 1
              )
          ))

          # Remove this temporary workflow after applying the patch.
          Path('.github/workflows/_apply_ai_difficulty.yml').unlink()
      - name: Verify targeted files
        run: |
          test ! -f .github/workflows/_apply_ai_difficulty.yml
          grep -q 'createAiRoundPlan' artifacts/api-server/src/routes/game.ts
          grep -q 'aiDifficulty' artifacts/stop-game/src/pages/SoloGame.tsx
          grep -q 'createAiRoundPlan' artifacts/stop-game/src/lib/offlineGame.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/routes/game.ts artifacts/api-server/src/lib/aiDifficulty.ts artifacts/stop-game/src/lib/offlineGame.ts artifacts/stop-game/src/pages/SoloGame.tsx lib/api-zod/src/generated/api.ts lib/api-zod/src/generated/types/validateRoundRequest.ts .github/workflows/_apply_ai_difficulty.yml
          git commit -m 'chore(ai): apply difficulty patch'
          git push
