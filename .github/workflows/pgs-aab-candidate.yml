name: Play Games signed AAB candidate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/pgs-noninteractive-startup-clean
    paths:
      - ".github/workflows/pgs-aab-candidate.yml"
      - "android-generated/**"
      - "artifacts/stop-game/src/pages/Home.tsx"
      - "artifacts/stop-game/src/lib/twaPlayGamesBridge.ts"

permissions:
  contents: read

concurrency:
  group: pgs-aab-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode and validate upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Verify intended release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 56' android-generated/app/build.gradle
          grep -Eq 'versionName "1\.3\.7\.1"' android-generated/app/build.gradle
          grep -Eq '<string name="game_services_project_id" translatable="false">902072408470</string>' android-generated/app/src/main/res/values/strings.xml
      - name: Build signed release bundle
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:bundleRelease --no-daemon --stacktrace
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB"
          sha256sum "$AAB"
      - name: Record upload certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            grep -E 'Alias name:|SHA1:|SHA256:'
      - name: Upload signed AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: stop-pgs-signed-aab-v56-candidate
          path: android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore
