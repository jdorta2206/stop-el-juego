name: Verify SEO homepage prerender

on:
  push:
    branches:
      - seo/prerender-homepage
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @workspace/stop-game build

      - name: Verify real Vite output
        working-directory: artifacts/stop-game
        shell: bash
        run: |
          test -f dist/index.html
          grep -q '<div id="root">' dist/index.html
          grep -q 'STOP: juego de palabras online' dist/index.html
          grep -q 'href="/como-jugar"' dist/index.html
          grep -q 'href="/blog"' dist/index.html
          grep -q 'href="/guias"' dist/index.html
          WORDS=$(python - <<'PY'
          import re
          from pathlib import Path
          html = Path("dist/index.html").read_text()
          root = re.search(r'<div id="root">(.*?)</div>', html, re.S | re.I).group(1)
          text = re.sub(r'<[^>]+>', ' ', root)
          text = re.sub(r'&[^;]+;', ' ', text)
          print(len([w for w in text.split() if w]))
          PY
          )
          test "$WORDS" -ge 300
          echo "PRERENDER_WORDS=$WORDS"
          echo "DIST_INDEX_BYTES=$(wc -c < dist/index.html)"

      - name: Serve exact dist and curl homepage
        working-directory: artifacts/stop-game
        shell: bash
        run: |
          python -m http.server 4173 --directory dist >/tmp/seo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          echo '----- CURL http://127.0.0.1:4173/ -----'
          curl --fail --silent --show-error http://127.0.0.1:4173/
          echo
          echo '----- END CURL -----'


      - name: Verify React replaces prerender without duplication
        working-directory: artifacts/stop-game
        shell: bash
        run: |
          mkdir -p /tmp/stop-browser-smoke
          cd /tmp/stop-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE/artifacts/stop-game"
          python -m http.server 4173 --directory dist >/tmp/seo-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node /tmp/stop-browser-smoke/node_modules/playwright/cli.js eval "http://127.0.0.1:4173/" >/dev/null 2>&1 || true
          cd /tmp/stop-browser-smoke
          node --input-type=commonjs <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle", timeout: 30000 });
            await page.waitForTimeout(4000);
            const result = await page.evaluate(() => {
              const root = document.getElementById("root");
              return {
                rootExists: !!root,
                prerenderNodes: root ? root.querySelectorAll('[data-prerendered="true"]').length : -1,
                homeTagline: document.body.innerText.includes("El juego que nadie supera"),
                playButton: document.body.innerText.includes("¡Jugar!"),
                rootTextLength: root?.innerText.length ?? 0,
              };
            });
            console.log("REACT_MOUNT_RESULT=" + JSON.stringify(result));
            if (!result.rootExists || result.prerenderNodes !== 0 || !result.homeTagline || !result.playButton || result.rootTextLength < 20) {
              throw new Error("React no sustituyó correctamente el prerender de portada.");
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload exact dist index
        uses: actions/upload-artifact@v4
        with:
          name: seo-homepage-dist-index
          path: artifacts/stop-game/dist/index.html
          retention-days: 7
