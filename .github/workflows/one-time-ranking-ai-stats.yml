name: One-time ranking AI stats patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch global ranking AI stats
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/routes/ranking.ts')
          s = p.read_text()
          old = '''  res.json({\n    players: players.map((p, i) => ({\n      id: p.id,\n      playerId: p.player_id,\n      playerName: p.player_name,\n      avatarColor: p.avatar_color,\n      totalScore: p.total_score,\n'''
          new = '''  res.json({\n    players: players.map((p, i) => {\n      let aiStats: { aiEasyGames?: unknown; aiExpertGames?: unknown } = {};\n      try {\n        const parsed = JSON.parse(String(p.achievement_stats_json ?? "{}"));\n        if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) aiStats = parsed;\n      } catch {}\n\n      return {\n      id: p.id,\n      playerId: p.player_id,\n      playerName: p.player_name,\n      avatarColor: p.avatar_color,\n      totalScore: p.total_score,\n'''
          if old not in s:
              raise SystemExit('Expected ranking response anchor not found; no changes made.')
          s = s.replace(old, new, 1)

          old2 = '''      achievementCount: parseAchievementCount(p.achievements_json),\n      title: getTitle(i + 1),\n'''
          new2 = '''      achievementCount: parseAchievementCount(p.achievements_json),\n      aiEasyGames: Math.max(0, Math.floor(Number(aiStats.aiEasyGames ?? 0))),\n      aiExpertGames: Math.max(0, Math.floor(Number(aiStats.aiExpertGames ?? 0))),\n      title: getTitle(i + 1),\n'''
          if old2 not in s:
              raise SystemExit('Expected achievement anchor not found; no changes made.')
          s = s.replace(old2, new2, 1)

          old3 = '''      rank: i + 1,\n    })),\n    total,\n'''
          new3 = '''      rank: i + 1,\n      };\n    }),\n    total,\n'''
          if old3 not in s:
              raise SystemExit('Expected ranking closing anchor not found; no changes made.')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- artifacts/api-server/src/routes/ranking.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/routes/ranking.ts
          git commit -m 'fix: expose AI difficulty stats in global ranking'
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/one-time-ranking-ai-stats.yml
          git commit -m 'chore: remove one-time ranking patch workflow'
          git push
