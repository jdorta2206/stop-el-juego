name: Android monetized debug

on:
  push:
    branches:
      - android/bubblewrap-admob
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate monetized TWA sources
        shell: bash
        run: |
          set -euo pipefail
          test -f android-generated/app/build.gradle
          test -f android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q "play-services-ads:25.4.0" android-generated/app/build.gradle
          grep -q "MobileAds" android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q "RewardedAd" android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q "super.onCreate(savedInstanceState);" android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          echo "Monetized TWA source validation: OK"

      - name: Build debug APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo '--- APK ---'
          ls -lh "$APK"
          echo '--- SHA-256 ---'
          sha256sum "$APK"
          echo '--- Certificate ---'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-monetized-debug
          path: android-generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
