name: CI

on:
  push:
    branches: [master, audit/security-hardening]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared workspaces
        run: |
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-zod build

      - name: API typecheck
        run: pnpm --filter @workspace/api-server typecheck

      - name: API tests
        run: pnpm --filter @workspace/api-server test

      - name: Frontend lint
        run: pnpm --filter @workspace/stop-game lint

      - name: Frontend build
        run: pnpm --filter @workspace/stop-game build

      - name: API build
        run: pnpm --filter @workspace/api-server build

      # Release gate: every stage above must pass before a merge to master.
