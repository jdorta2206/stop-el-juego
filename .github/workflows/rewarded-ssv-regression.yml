name: Rewarded AdMob SSV regression

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/admobRewardPoll.ts"
      - "artifacts/api-server/src/routes/rewards.ts"
      - "artifacts/api-server/src/routes/rewards.admob-poll.test.ts"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/rewarded-ssv-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewarded-ssv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run rewarded SSV regression tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/rewards.admob-poll.test.ts
      - name: Build workspace TypeScript references
        run: pnpm run typecheck:libs
      - name: Typecheck changed SSV helper and regression tests
        run: pnpm --filter @workspace/api-server exec tsc --noEmit --skipLibCheck --strict --target ES2022 --module ESNext --moduleResolution Bundler --types node,vitest/globals src/lib/admobRewardPoll.ts src/routes/rewards.admob-poll.test.ts
