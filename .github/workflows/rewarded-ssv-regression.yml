name: Rewarded AdMob SSV regression

on:
  push:
    branches:
      - "fix/rewarded-game-state-recovery"
    paths:
      - "artifacts/api-server/src/lib/admobSsv.ts"
      - "artifacts/api-server/src/lib/admobSsv.test.ts"
      - "artifacts/api-server/src/lib/admobRewardPoll.ts"
      - "artifacts/api-server/src/routes/rewards.ts"
      - "artifacts/api-server/src/routes/rewards.admob-poll.test.ts"
      - "artifacts/api-server/src/routes/rewards.client-flow.test.ts"
      - "artifacts/api-server/src/routes/ranking.ts"
      - "artifacts/api-server/src/routes/ranking.bonus-concurrency.integration.test.ts"
      - ".github/workflows/rewarded-ssv-regression.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/admobSsv.ts"
      - "artifacts/api-server/src/lib/admobSsv.test.ts"
      - "artifacts/api-server/src/lib/admobRewardPoll.ts"
      - "artifacts/api-server/src/routes/rewards.ts"
      - "artifacts/api-server/src/routes/rewards.admob-poll.test.ts"
      - "artifacts/api-server/src/routes/rewards.client-flow.test.ts"
      - "artifacts/stop-game/src/lib/twaAdBridge.ts"
      - "artifacts/api-server/src/routes/ranking.ts"
      - "artifacts/api-server/src/routes/ranking.bonus-concurrency.integration.test.ts"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/rewarded-ssv-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewarded-ssv:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stop_test
          POSTGRES_PASSWORD: stop_test
          POSTGRES_DB: stop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stop_test -d stop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://stop_test:stop_test@localhost:5432/stop_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run rewarded SSV regression tests
        run: pnpm --filter @workspace/api-server exec vitest run src/lib/admobSsv.test.ts src/routes/rewards.admob-poll.test.ts src/routes/rewards.client-flow.test.ts
      - name: Verify bonus-claim rollback against PostgreSQL
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/ranking.bonus-concurrency.integration.test.ts
      - name: Build workspace TypeScript references
        run: pnpm run typecheck:libs
      - name: Typecheck changed SSV helper and regression tests
        run: pnpm --filter @workspace/api-server exec tsc --noEmit --skipLibCheck --strict --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --types node,vitest/globals src/lib/admobSsv.ts src/lib/admobSsv.test.ts src/lib/admobRewardPoll.ts src/routes/rewards.admob-poll.test.ts src/routes/rewards.client-flow.test.ts
