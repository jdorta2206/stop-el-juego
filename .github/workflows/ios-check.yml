name: iOS App Check

on:
  push:
    branches: [ios-app-prep-2026]
    paths:
      - 'artifacts/stop-ios/**'
      - '.github/workflows/ios-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'artifacts/stop-ios/**'
      - '.github/workflows/ios-check.yml'

jobs:
  validate:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: artifacts/stop-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: artifacts/stop-ios/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor
