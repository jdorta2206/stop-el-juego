name: iOS App Check

on:
  push:
    branches: [ios-app]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-check.yml'

jobs:
  validate:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Expo doctor
        id: doctor
        continue-on-error: true
        run: npx expo-doctor 2>&1 | tee /tmp/expo-doctor.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-diagnostics
          path: |
            /tmp/typecheck.log
            /tmp/expo-doctor.log
          if-no-files-found: warn
      - name: Fail if validation failed
        if: steps.typecheck.outcome == 'failure' || steps.doctor.outcome == 'failure'
        run: exit 1
