name: Validate multiplayer telemetry fix

on:
  pull_request:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - "artifacts/stop-game/src/pages/Room.tsx"
      - ".github/workflows/validate-multiplayer-telemetry.yml"
  push:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - ".github/workflows/validate-multiplayer-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-telemetry-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Build workspace
        run: pnpm run build
      - name: Verify frontend output exists
        run: test -f artifacts/stop-game/dist/index.html
