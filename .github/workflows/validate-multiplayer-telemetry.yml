name: Validate multiplayer telemetry fix

on:
  pull_request:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - "artifacts/stop-game/src/pages/Room.tsx"
      - "artifacts/api-server/src/routes/adminHealth.ts"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/build.ts"
      - ".github/workflows/validate-multiplayer-telemetry.yml"
  push:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - ".github/workflows/validate-multiplayer-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-telemetry-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API unit tests
        run: pnpm --filter @workspace/api-server test
      - name: Build API server package
        run: pnpm --filter @workspace/api-server build
      - name: Verify API output exists
        run: test -f artifacts/api-server/dist/index.cjs
      - name: Report API typecheck
        if: always()
        continue-on-error: true
        run: pnpm --filter @workspace/api-server typecheck
      - name: Build frontend package
        run: pnpm --filter @workspace/stop-game build
      - name: Verify frontend output exists
        run: test -f artifacts/stop-game/dist/index.html
      - name: Report frontend typecheck
        if: always()
        continue-on-error: true
        run: pnpm --filter @workspace/stop-game exec tsc --noEmit -p tsconfig.json
      - name: Report workspace-wide typecheck
        if: always()
        continue-on-error: true
        run: pnpm run typecheck
