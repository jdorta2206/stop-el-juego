name: Multiplayer PR preview
on:
  push:
    branches:
      - fix/multiplayer-interstitial-every-3
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: multiplayer-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web preview
        env:
          VITE_API_URL: ''
        run: pnpm --filter @workspace/stop-game build
      - name: Verify build
        run: test -s artifacts/stop-game/dist/index.html
      - name: Start preview with real API proxy
        run: |
          set -euo pipefail
          cat > /tmp/pr-preview-server.py <<'PY'
          import http.client, os
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from urllib.parse import urlsplit

          DIST = os.path.abspath("artifacts/stop-game/dist")
          UPSTREAM = "www.stopjuegodepalabras.com"

          class Handler(SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=DIST, **kwargs)
              def _proxy(self):
                  target = urlsplit(self.path)
                  path = target.path + (("?" + target.query) if target.query else "")
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  body = self.rfile.read(length) if length else None
                  headers = {k: v for k, v in self.headers.items()
                             if k.lower() not in {"host","content-length","origin","referer","connection"}}
                  headers["Host"] = UPSTREAM
                  headers["X-PR-Preview"] = "1"
                  conn = http.client.HTTPSConnection(UPSTREAM, timeout=90)
                  try:
                      conn.request(self.command, path, body=body, headers=headers)
                      resp = conn.getresponse()
                      self.send_response(resp.status, resp.reason)
                      content_type = (resp.getheader("Content-Type") or "").lower()
                      for key, value in resp.getheaders():
                          if key.lower() not in {"transfer-encoding","connection","content-encoding","content-length"}:
                              self.send_header(key, value)
                      if "text/event-stream" in content_type:
                          self.end_headers()
                          while True:
                              chunk = resp.read1(4096) if hasattr(resp, "read1") else resp.readline()
                              if not chunk: break
                              self.wfile.write(chunk); self.wfile.flush()
                          return
                      data = resp.read()
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      if data: self.wfile.write(data); self.wfile.flush()
                  finally:
                      conn.close()
              def do_GET(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  return super().do_GET()
              def do_POST(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_PUT(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_PATCH(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_DELETE(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_error(405)
              def do_OPTIONS(self):
                  if self.path.startswith("/api/"): return self._proxy()
                  self.send_response(204); self.end_headers()
              def send_error(self, code, message=None, explain=None):
                  if code == 404 and not self.path.startswith("/api/"):
                      self.path = "/index.html"
                      return super().do_GET()
                  return super().send_error(code, message, explain)

          os.chdir(DIST)
          ThreadingHTTPServer(("127.0.0.1",4173), Handler).serve_forever()
          PY
          python3 -m py_compile /tmp/pr-preview-server.py
          nohup python3 /tmp/pr-preview-server.py >/tmp/preview-http.log 2>&1 &
          sleep 2
          curl -fsS --max-time 10 http://127.0.0.1:4173/ >/dev/null
      - name: Smoke test room API
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --max-time 30 http://127.0.0.1:4173/api/rooms/public)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"rooms"'
      - name: Start public preview tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --logfile /tmp/cloudflared.log --url http://127.0.0.1:4173 >/tmp/cloudflared-stdout.log 2>&1 &
          sleep 8
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[^[:space:]]+trycloudflare[.]com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          test -n "${URL:-}" || { cat /tmp/cloudflared.log; exit 1; }
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          printf '%s\n' "$URL" > /tmp/pr-preview-url.txt
          {
            echo "## Multiplayer PR preview"
            echo
            echo "$URL"
            echo
            echo "El enlace permanece activo mientras este workflow esté ejecutándose."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preview URL
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-pr-preview-url
          path: /tmp/pr-preview-url.txt
          retention-days: 1
      - name: Keep preview available for manual testing
        run: sleep 10800
      - name: Stop preview processes
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f pr-preview-server.py || true
