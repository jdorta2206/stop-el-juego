name: Validate Android native startup

on:
  push:
    branches: [android/bubblewrap-admob]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate native project
        working-directory: android-generated
        run: |
          set -euo pipefail
          grep -q 'minSdkVersion 23' app/build.gradle
          grep -q 'targetSdkVersion 36' app/build.gradle
          grep -q 'versionCode 17' app/build.gradle
          grep -q 'versionName "1.3.6.3"' app/build.gradle
          grep -q 'androidbrowserhelper:2.7.3' app/build.gradle
          ! grep -q 'play-services-ads' app/build.gradle
          ! grep -q 'com.google.android.gms.ads.APPLICATION_ID' app/src/main/AndroidManifest.xml
          ! grep -q 'PaymentActivity' app/src/main/AndroidManifest.xml
          ! grep -q 'PaymentService' app/src/main/AndroidManifest.xml
          grep -q 'public class LauncherActivity extends android.app.Activity' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          ./gradlew assembleDebug --no-daemon
      - name: Upload native startup debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-native-startup-debug
          path: android-generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Forced validation trigger after correcting the startup-isolation assertion.
