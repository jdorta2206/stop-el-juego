name: Validate Android AdMob + Play Billing TWA

on:
  push:
    branches: [android/bubblewrap-admob]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android monetized project
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minSdkVersion 23' app/build.gradle
          grep -q 'targetSdkVersion 36' app/build.gradle
          grep -q 'versionCode 20' app/build.gradle
          grep -q 'versionName "1.3.6.3"' app/build.gradle
          grep -q 'androidbrowserhelper:2.7.3' app/build.gradle
          grep -q 'com.google.androidbrowserhelper:billing:1.2.0' app/build.gradle
          grep -q 'play-services-ads:25.4.0' app/build.gradle
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' app/src/main/AndroidManifest.xml
          grep -q 'com.android.vending.BILLING' app/src/main/AndroidManifest.xml
          grep -q 'MobileAds' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'CustomTabsSession' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'requestPostMessageChannel' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'STOP_AD_REWARDED_RESULT' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'ca-app-pub-4807272408824742/3559554716' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'ca-app-pub-4807272408824742/7242069847' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'public class DelegationService extends com.google.androidbrowserhelper.trusted.DelegationService' app/src/main/java/app/replit/stop_el_juego/twa/DelegationService.java
          grep -q 'DigitalGoodsRequestHandler' app/src/main/java/app/replit/stop_el_juego/twa/DelegationService.java
          grep -q 'com.google.androidbrowserhelper.playbilling.provider.PaymentActivity' app/src/main/AndroidManifest.xml
          grep -q 'com.google.androidbrowserhelper.playbilling.provider.PaymentService' app/src/main/AndroidManifest.xml
          grep -q 'android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'public class LauncherActivity extends com.google.androidbrowserhelper.trusted.LauncherActivity' app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          chmod +x ./gradlew
          bash ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify debug APK and signing certificate
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
          echo '--- APK signing certificate ---'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload Android monetized debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-monetized-debug
          path: android-generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Final Android validation: TWA + AdMob + Google Play Billing 1.2.0.
