name: Verify and integrate AI difficulty

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feat/ai-difficulty-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-difficulty-v2
          fetch-depth: 0

      - name: Apply safe integration patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing anchor: {label}')
              return text.replace(old, new, 1)

          # Server: difficulty + elapsed time are metadata headers, so the public validation body is untouched.
          p = Path('artifacts/api-server/src/routes/game.ts')
          s = p.read_text()
          if 'from "../lib/aiDifficulty"' not in s:
              s = replace_once(s,
                  'import { normalizeWord, isSafeInput } from "../lib/wordRules";',
                  'import { normalizeWord, isSafeInput } from "../lib/wordRules";\nimport { createAiRoundPlan, shouldAiAnswer, type AiDifficulty } from "../lib/aiDifficulty";',
                  'server import')
          if 'const aiPlan = createAiRoundPlan' not in s:
              s = replace_once(s,
                  'for (const pr of playerResponses) {',
                  '''const rawDifficulty = String(req.header("x-ai-difficulty") || "easy").toLowerCase();
          const aiDifficulty: AiDifficulty = rawDifficulty === "expert" ? "expert" : "easy";
          const rawElapsed = Number(req.header("x-ai-elapsed-ms"));
          const elapsedMs = Number.isFinite(rawElapsed) ? Math.max(0, Math.min(rawElapsed, 60000)) : 60000;
          const aiPlan = createAiRoundPlan(playerResponses.map((p) => p.category), aiDifficulty, elapsedMs);

          for (const pr of playerResponses) {''',
                  'server plan')
          old = 'const aiWord = getAiWord(letter, pr.category, language);'
          new = 'const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWord(letter, pr.category, language) : "";'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Client: call validateRound directly so custom request headers can be supplied without changing the generated API schema.
          p = Path('artifacts/stop-game/src/pages/SoloGame.tsx')
          s = p.read_text()
          s = s.replace('useValidateRound, useSubmitScore, type CategoryResult, type ValidateRoundResponse', 'useValidateRound, validateRound, useSubmitScore, type CategoryResult, type ValidateRoundResponse', 1)
          marker = 'const timerRef = useRef<NodeJS.Timeout>(null);'
          if 'const aiRoundStartedAtRef' not in s:
              s = replace_once(s, marker, marker + '\n  const aiRoundStartedAtRef = useRef<number>(0);\n  const [aiDifficulty] = useState<"easy" | "expert">(() => new URLSearchParams(window.location.search).get("ai") === "expert" ? "expert" : "easy");', 'client refs')
          marker = 'setGameState("PLAYING");\n    setTimeLeft(roundTime);'
          if 'aiRoundStartedAtRef.current = Date.now();' not in s:
              s = replace_once(s, marker, 'setGameState("PLAYING");\n    aiRoundStartedAtRef.current = Date.now();\n    setTimeLeft(roundTime);', 'round start timestamp')
          old_call = '''validateMutation.mutateAsync({
          data: {
            letter,
            language: getCurrentLang() as import("@workspace/api-client-react").ValidateRoundRequestLanguage,
            playerName: player?.name,
            playerResponses: formattedResponses,
          }
        })'''
          new_call = '''validateRound({
          letter,
          language: getCurrentLang() as import("@workspace/api-client-react").ValidateRoundRequestLanguage,
          playerName: player?.name,
          playerResponses: formattedResponses,
        }, {
          headers: {
            ...authHeaders(),
            "x-ai-difficulty": aiDifficulty,
            "x-ai-elapsed-ms": String(Math.max(0, Date.now() - aiRoundStartedAtRef.current)),
          },
        })'''
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          p.write_text(s)

          # Offline: same plan and timing, with no timers/blocking.
          p = Path('artifacts/stop-game/src/lib/offlineGame.ts')
          s = p.read_text()
          if 'from "./aiDifficulty"' not in s:
              s = replace_once(s, 'import { getApiUrl } from "./utils";', 'import { getApiUrl } from "./utils";\nimport { createAiRoundPlan, shouldAiAnswer, type AiDifficulty } from "./aiDifficulty";', 'offline import')
          marker = '  playerResponses: { category: string; word: string }[];\n};'
          if 'difficulty?: AiDifficulty;' not in s:
              s = replace_once(s, marker, '  playerResponses: { category: string; word: string }[];\n  difficulty?: AiDifficulty;\n  elapsedMs?: number;\n};', 'offline request metadata')
          marker = '  const results: OfflineValidateResponse["results"] = {};\n  let playerTotalScore = 0;'
          if 'const aiPlan = createAiRoundPlan' not in s:
              s = replace_once(s, marker, '''  const results: OfflineValidateResponse["results"] = {};
  const aiPlan = createAiRoundPlan(
    playerResponses.map((p) => p.category),
    req.difficulty ?? "easy",
    req.elapsedMs ?? 60000,
  );
  let playerTotalScore = 0;''', 'offline plan')
          old = 'const aiWord = getAiWordOffline(letter, pr.category, language);'
          new = 'const aiWord = shouldAiAnswer(aiPlan, pr.category) ? getAiWordOffline(letter, pr.category, language) : "";'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          print('integration applied')

      - name: TypeScript syntax/build checks
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server exec tsc --noEmit
          pnpm --filter @workspace/stop-game exec tsc --noEmit

      - name: Diff check
        run: git diff --check

      - name: Commit verified integration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/game.ts artifacts/stop-game/src/pages/SoloGame.tsx artifacts/stop-game/src/lib/offlineGame.ts
          git diff --cached --quiet || git commit -m "feat(ai): integrate easy and expert difficulty safely"
          git push origin HEAD:feat/ai-difficulty-v2
