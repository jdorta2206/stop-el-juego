name: Build Android signed Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set v40 version code and force AD_ID
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode [0-9]+/versionCode 40/' app/build.gradle
          grep -q 'versionCode 40' app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />'
          if 'com.google.android.gms.permission.AD_ID' not in s:
              marker = '    <uses-permission android:name="com.android.vending.BILLING" />'
              if marker not in s:
                  raise SystemExit('BILLING permission marker not found')
              s = s.replace(marker, marker + '\n' + perm, 1)
              p.write_text(s)
          if 'com.google.android.gms.permission.AD_ID' not in p.read_text():
              raise SystemExit('AD_ID permission missing before build')
          PY
      - name: Build signed Release APK and AAB
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Verify final APK and AAB contain AD_ID
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q 'com.google.android.gms.permission.AD_ID' /tmp/apk-permissions.txt || { echo 'ERROR: final APK does not contain AD_ID'; exit 1; }
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          aab = Path('app/build/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(aab) as z:
              name = 'base/manifest/AndroidManifest.xml'
              if name not in z.namelist():
                  raise SystemExit('ERROR: base manifest missing from AAB')
              data = z.read(name)
          marker = b'com.google.android.gms.permission.AD_ID'
          if marker not in data:
              raise SystemExit('ERROR: AAB base manifest does not contain AD_ID')
          print('OK: AAB base manifest contains AD_ID')
          PY
          sha256sum "$APK"
          sha256sum "$AAB"
          ls -lh "$APK" "$AAB"
      - name: Upload signed Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-release-signed-v40-ad-id-verified
          path: |
            android-generated/app/build/outputs/apk/release/app-release.apk
            android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore
