name: Build Android signed Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          test -s android-release.keystore

      - name: Configure Release signing
        working-directory: android-generated
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat >> app/build.gradle <<'EOF'

android.signingConfigs {
    ciRelease {
        storeFile file("../../android-release.keystore")
        storePassword System.getenv("KEYSTORE_PASSWORD")
        keyAlias System.getenv("KEY_ALIAS")
        keyPassword System.getenv("KEY_PASSWORD")
    }
}

android.buildTypes.release.signingConfig android.signingConfigs.ciRelease
EOF

      - name: Build signed Release APK and AAB
        working-directory: android-generated
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Release signing certificate
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          echo '--- Release APK certificate ---'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo '--- Release APK SHA-256 ---'
          sha256sum "$APK"
          echo '--- AAB ---'
          ls -lh "$AAB"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore

      - name: Upload signed Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stop-android-release-signed
          path: |
            android-generated/app/build/outputs/apk/release/app-release.apk
            android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
