name: Validate Android debug build

on:
  push:
    branches:
      - feat/google-play-games-integration
  pull_request:
    branches:
      - fix/audit-health-diagnostic-build
    paths:
      - "android-generated/**"
      - ".github/workflows/pgs-android-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and AAB (no signing secrets)
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug
      - name: Verify debug artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test -s android-generated/app/build/outputs/apk/debug/app-debug.apk
          test -s android-generated/app/build/outputs/bundle/debug/app-debug.aab
