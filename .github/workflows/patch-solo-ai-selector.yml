name: Add Solo AI difficulty selector

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-solo-ai-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visible Easy/Expert selector to Solo lobby
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/stop-game/src/pages/SoloGame.tsx')
          text = path.read_text(encoding='utf-8')

          if 'data-ai-difficulty-selector' in text:
              print('Selector already present; nothing to do.')
              raise SystemExit(0)

          anchor = '<Button size="xl" onClick={startGame}>{t.game.round} {round}</Button>'
          if anchor not in text:
              raise SystemExit('Lobby start button anchor not found')

          selector = '''              {!isDailyMode && !isQuickMode && !isChaosMode && !isRandomMode && (\n                <div\n                  data-ai-difficulty-selector\n                  className="w-full max-w-sm rounded-2xl p-4 text-left"\n                  style={{\n                    background: "rgba(0,0,0,0.22)",\n                    border: "1px solid rgba(255,255,255,0.14)",\n                  }}\n                >\n                  <div className="flex items-center justify-between mb-3">\n                    <div>\n                      <p className="text-white font-black text-base">🤖 {lang === "en" ? "AI difficulty" : "Dificultad de la IA"}</p>\n                      <p className="text-white/50 text-xs mt-0.5">\n                        {lang === "en" ? "Choose how challenging the opponent is" : "Elige qué difícil será el rival"}\n                      </p>\n                    </div>\n                    <span className="text-xs font-black text-white/40 uppercase">{aiDifficulty === "expert" ? "95%" : "60%"}</span>\n                  </div>\n                  <div className="grid grid-cols-2 gap-2">\n                    <button\n                      type="button"\n                      onClick={() => setAiDifficulty("easy")}\n                      aria-pressed={aiDifficulty === "easy"}\n                      className="rounded-xl px-3 py-3 font-black transition-all"\n                      style={{\n                        background: aiDifficulty === "easy" ? "linear-gradient(135deg, #4ade80, #16a34a)" : "rgba(255,255,255,0.07)",\n                        color: aiDifficulty === "easy" ? "#071b0d" : "rgba(255,255,255,0.75)",\n                        border: aiDifficulty === "easy" ? "2px solid rgba(255,255,255,0.55)" : "1px solid rgba(255,255,255,0.12)",\n                      }}\n                    >\n                      🟢 {lang === "en" ? "Easy" : "Fácil"}\n                    </button>\n                    <button\n                      type="button"\n                      onClick={() => setAiDifficulty("expert")}\n                      aria-pressed={aiDifficulty === "expert"}\n                      className="rounded-xl px-3 py-3 font-black transition-all"\n                      style={{\n                        background: aiDifficulty === "expert" ? "linear-gradient(135deg, #f59e0b, #dc2626)" : "rgba(255,255,255,0.07)",\n                        color: "white",\n                        border: aiDifficulty === "expert" ? "2px solid rgba(255,255,255,0.55)" : "1px solid rgba(255,255,255,0.12)",\n                      }}\n                    >\n                      🔥 {lang === "en" ? "Expert" : "Experto"}\n                    </button>\n                  </div>\n                </div>\n              )}\n\n'''

          text = text.replace(anchor, selector + anchor, 1)
          path.write_text(text, encoding='utf-8')
          print('Solo AI difficulty selector added.')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/stop-game/src/pages/SoloGame.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(solo): add visible AI difficulty selector"
          git push
