name: Android Play Games startup UI test bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - fix/interstitial-twa-detection-final
      - feat/google-play-games-native-bridge

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.keystore
          keytool -list -keystore android-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Set diagnostic version code
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode [0-9]+/versionCode 58/; s/versionName "[^"]+"/versionName "1.3.7.2"/' app/build.gradle
          grep -q 'versionCode 58' app/build.gradle
          grep -q 'versionName "1.3.7.2"' app/build.gradle
      - name: Build signed Play Games test bundle
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace
      - name: Verify signed Android App Bundle
        working-directory: android-generated
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          sha256sum "$AAB"
      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: stop-play-games-startup-v58-aab
          path: android-generated/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android-release.keystore
