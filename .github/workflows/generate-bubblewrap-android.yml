name: Generate Bubblewrap Android project

on:
  push:
    branches: [android/bubblewrap-admob]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip android-generation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android/bubblewrap-admob
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Bubblewrap core
        run: npm install --no-save @bubblewrap/core@1.25.0
      - name: Generate TWA project without interactive prompts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-generated
          mkdir -p android-generated
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');
          (async () => {
            const out = path.resolve('android-generated');
            const source = path.resolve('android/twa-manifest.json');
            const generationManifest = path.join(out, 'twa-manifest-generation.json');
            const raw = JSON.parse(fs.readFileSync(source, 'utf8'));
            if (raw.startUrl?.startsWith('https://')) {
              const u = new URL(raw.startUrl);
              raw.launchUrl = u.pathname + u.search;
            } else if (!raw.launchUrl) {
              raw.launchUrl = '/';
            }
            raw.maskableIconUrl = raw.iconUrl;
            raw.monochromeIconUrl = raw.iconUrl;
            fs.writeFileSync(generationManifest, JSON.stringify(raw, null, 2));
            const manifest = await TwaManifest.fromFile(generationManifest);
            await manifest.saveToFile(path.join(out, 'twa-manifest.json'));
            const generator = new TwaGenerator();
            await generator.createTwaProject(out, manifest);
            const gradle = path.join(out, 'app', 'build.gradle');
            let text = fs.readFileSync(gradle, 'utf8');
            text = text.replace('splashScreenFadeOutDuration: ,', 'splashScreenFadeOutDuration: 0,');
            text = text.replace('versionName ""', 'versionName "1.3.6.3"');
            text = text.replace(/minSdkVersion\s+21/, 'minSdkVersion 23');
            fs.writeFileSync(gradle, text);
            const data = fs.readFileSync(path.join(out, 'twa-manifest.json'));
            fs.writeFileSync(path.join(out, 'manifest-checksum.txt'), crypto.createHash('sha1').update(data).digest('hex'));
            fs.rmSync(generationManifest, { force: true });
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Verify generated project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f android-generated/gradlew
          test -f android-generated/settings.gradle
          test -f android-generated/app/build.gradle
          test -f android-generated/app/src/main/AndroidManifest.xml
          test -f android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'versionName "1.3.6.3"' android-generated/app/build.gradle
          grep -q 'splashScreenFadeOutDuration: 0' android-generated/app/build.gradle
          grep -q 'minSdkVersion 23' android-generated/app/build.gradle
          ! grep -q 'splashScreenFadeOutDuration: ,' android-generated/app/build.gradle
          ! grep -q 'versionName ""' android-generated/app/build.gradle
          ! grep -q 'https://www.stopjuegodepalabras.comhttps://' android-generated/app/build.gradle
      - name: Build unsigned debug APK
        working-directory: android-generated
        run: ./gradlew assembleDebug --no-daemon
      - name: Remove generated build/cache files
        run: rm -rf android-generated/.gradle android-generated/app/build android-generated/build && rm -f android-generated/android-keystore
      - name: Commit generated Android project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-generated .github/workflows/generate-bubblewrap-android.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(android): add validated Bubblewrap project [skip android-generation]'
          git push origin HEAD:android/bubblewrap-admob
