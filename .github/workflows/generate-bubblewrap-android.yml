name: Generate Bubblewrap Android project

on:
  push:
    branches: [android/bubblewrap-admob]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip android-generation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android/bubblewrap-admob
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Bubblewrap core
        run: npm install --no-save @bubblewrap/core@1.25.0
      - name: Generate TWA project without interactive prompts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-generated
          mkdir -p android-generated
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');
          (async () => {
            const out = path.resolve('android-generated');
            const source = path.resolve('android/twa-manifest.json');
            const generationManifest = path.join(out, 'twa-manifest-generation.json');
            const raw = JSON.parse(fs.readFileSync(source, 'utf8'));
            if (raw.startUrl?.startsWith('https://')) {
              const u = new URL(raw.startUrl);
              raw.launchUrl = u.pathname + u.search;
            } else if (!raw.launchUrl) {
              raw.launchUrl = '/';
            }
            raw.maskableIconUrl = raw.iconUrl;
            raw.monochromeIconUrl = raw.iconUrl;
            fs.writeFileSync(generationManifest, JSON.stringify(raw, null, 2));
            const manifest = await TwaManifest.fromFile(generationManifest);
            await manifest.saveToFile(path.join(out, 'twa-manifest.json'));
            const generator = new TwaGenerator();
            await generator.createTwaProject(out, manifest);
            const gradle = path.join(out, 'app', 'build.gradle');
            let text = fs.readFileSync(gradle, 'utf8');
            text = text.replace('splashScreenFadeOutDuration: ,', 'splashScreenFadeOutDuration: 0,');
            text = text.replace('versionName ""', 'versionName "1.3.6.3"');
            text = text.replace(/minSdkVersion\s+21/, 'minSdkVersion 23');
            text = text.replace("implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.0-alpha02'", "implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.0-alpha02'\n        implementation 'com.google.android.gms:play-services-ads:25.4.0'");
            fs.writeFileSync(gradle, text);

            const launcher = path.join(out, 'app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java');
            fs.writeFileSync(launcher, `package app.replit.stop_el_juego.twa;\n\nimport android.content.ComponentName;\nimport android.content.pm.ActivityInfo;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.util.Log;\n\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\nimport androidx.browser.customtabs.CustomTabsCallback;\nimport androidx.browser.customtabs.CustomTabsClient;\nimport androidx.browser.customtabs.CustomTabsServiceConnection;\nimport androidx.browser.customtabs.CustomTabsSession;\n\nimport com.google.android.gms.ads.AdRequest;\nimport com.google.android.gms.ads.LoadAdError;\nimport com.google.android.gms.ads.MobileAds;\nimport com.google.android.gms.ads.rewarded.RewardItem;\nimport com.google.android.gms.ads.rewarded.RewardedAd;\nimport com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;\n\nimport org.json.JSONException;\nimport org.json.JSONObject;\n\npublic class LauncherActivity extends com.google.androidbrowserhelper.trusted.LauncherActivity {\n    private static final String TAG = "STOP_AD_BRIDGE";\n    private static final String ORIGIN = "https://www.stopjuegodepalabras.com";\n    private static final String REWARDED_TEST_ID = "ca-app-pub-3940256099942544/5224354917";\n\n    private CustomTabsClient customTabsClient;\n    private CustomTabsSession customTabsSession;\n    private boolean relationshipValidated;\n    private boolean messageChannelReady;\n    private RewardedAd rewardedAd;\n    private boolean rewardedAdLoading;\n    private boolean rewardGrantedForCurrentAd;\n    private String activeRequestId;\n    private String activePlacement;\n\n    private final CustomTabsCallback customTabsCallback = new CustomTabsCallback() {\n        @Override\n        public void onRelationshipValidationResult(int relation, @NonNull Uri requestedOrigin, boolean result, @Nullable Bundle extras) {\n            relationshipValidated = result;\n            Log.d(TAG, "use_as_origin validation=" + result + " origin=" + requestedOrigin);\n        }\n\n        @Override\n        public void onNavigationEvent(int navigationEvent, @Nullable Bundle extras) {\n            if (navigationEvent != NAVIGATION_FINISHED || customTabsSession == null || !relationshipValidated) return;\n            boolean requested = customTabsSession.requestPostMessageChannel(\n                    Uri.parse(ORIGIN), Uri.parse(ORIGIN), new Bundle());\n            Log.d(TAG, "requestPostMessageChannel=" + requested);\n        }\n\n        @Override\n        public void onMessageChannelReady(@Nullable Bundle extras) {\n            messageChannelReady = true;\n            sendMessage(new JSONObject().putSafe("type", "STOP_AD_BRIDGE_READY"));\n            Log.d(TAG, "TWA message channel ready");\n        }\n\n        @Override\n        public void onPostMessage(@NonNull String message, @Nullable Bundle extras) {\n            handleWebMessage(message);\n        }\n    };\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        bindPostMessageChannel();\n        MobileAds.initialize(this, status -> {});\n        preloadRewardedAd();\n        super.onCreate(savedInstanceState);\n        if (Build.VERSION.SDK_INT > Build.VERSION_CODES.O) {\n            setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_USER_PORTRAIT);\n        } else {\n            setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);\n        }\n    }\n\n    private void bindPostMessageChannel() {\n        String packageName = CustomTabsClient.getPackageName(this, null);\n        if (packageName == null) return;\n        CustomTabsClient.bindCustomTabsService(this, packageName, new CustomTabsServiceConnection() {\n            @Override\n            public void onCustomTabsServiceConnected(@NonNull ComponentName name, @NonNull CustomTabsClient client) {\n                customTabsClient = client;\n                client.warmup(0L);\n                customTabsSession = client.newSession(customTabsCallback);\n                if (customTabsSession != null) {\n                    customTabsSession.validateRelationship(\n                            CustomTabsClient.RELATION_USE_AS_ORIGIN, Uri.parse(ORIGIN), new Bundle());\n                }\n            }\n\n            @Override\n            public void onServiceDisconnected(ComponentName name) {\n                customTabsClient = null;\n                customTabsSession = null;\n                messageChannelReady = false;\n            }\n        });\n    }\n\n    private void handleWebMessage(String raw) {\n        try {\n            JSONObject message = new JSONObject(raw);\n            if (!"STOP_AD_REQUEST_REWARDED".equals(message.optString("type"))) return;\n            String requestId = message.optString("requestId", "");\n            String placement = message.optString("placement", "extra_time");\n            if (requestId.isEmpty() || !messageChannelReady) return;\n            if (!"extra_time".equals(placement) && !"hint".equals(placement) && !"double_points".equals(placement) && !"skip_round".equals(placement) && !"extra_pack".equals(placement)) return;\n            if (activeRequestId != null) return;\n            activeRequestId = requestId;\n            activePlacement = placement;\n            rewardGrantedForCurrentAd = false;\n            showRewardedAd();\n        } catch (JSONException ignored) {\n            Log.w(TAG, "Ignoring malformed web message");\n        }\n    }\n\n    private void preloadRewardedAd() {\n        if (rewardedAd != null || rewardedAdLoading) return;\n        rewardedAdLoading = true;\n        RewardedAd.load(this, REWARDED_TEST_ID, new AdRequest.Builder().build(), new RewardedAdLoadCallback() {\n            @Override\n            public void onAdLoaded(@NonNull RewardedAd ad) {\n                rewardedAdLoading = false;\n                rewardedAd = ad;\n            }\n\n            @Override\n            public void onAdFailedToLoad(@NonNull LoadAdError error) {\n                rewardedAdLoading = false;\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load failed: " + error.getCode());\n            }\n        });\n    }\n\n    private void showRewardedAd() {\n        if (rewardedAd == null) {\n            sendResult(false, "error");\n            preloadRewardedAd();\n            return;\n        }\n        RewardedAd ad = rewardedAd;\n        rewardedAd = null;\n        ad.setFullScreenContentCallback(new com.google.android.gms.ads.FullScreenContentCallback() {\n            @Override\n            public void onAdDismissedFullScreenContent() {\n                if (!rewardGrantedForCurrentAd) sendResult(false, "skipped");\n                preloadRewardedAd();\n            }\n            @Override\n            public void onAdFailedToShowFullScreenContent(@NonNull com.google.android.gms.ads.AdError adError) {\n                sendResult(false, "error");\n                preloadRewardedAd();\n            }\n        });\n        ad.show(this, (RewardItem rewardItem) -> {\n            rewardGrantedForCurrentAd = true;\n            sendResult(true, "admob");\n        });\n    }\n\n    private void sendResult(boolean rewarded, String source) {\n        if (activeRequestId == null) return;\n        JSONObject result = new JSONObject();\n        try {\n            result.put("type", "STOP_AD_REWARDED_RESULT");\n            result.put("requestId", activeRequestId);\n            result.put("placement", activePlacement);\n            result.put("rewarded", rewarded);\n            result.put("source", source);\n        } catch (JSONException ignored) {\n            return;\n        }\n        sendMessage(result);\n        activeRequestId = null;\n        activePlacement = null;\n        rewardGrantedForCurrentAd = false;\n    }\n\n    private void sendMessage(JSONObject message) {\n        if (customTabsSession == null || !messageChannelReady) return;\n        customTabsSession.postMessage(message.toString(), null);\n    }\n\n    @Override\n    protected Uri getLaunchingUrl() {\n        return super.getLaunchingUrl();\n    }\n\n    // Small helper so the generated project remains dependency-free apart from AndroidX/AdMob.\n    private static final class JSONObjectSafe extends JSONObject {\n        JSONObjectSafe putSafe(String key, String value) {\n            try { put(key, value); } catch (JSONException ignored) {}\n            return this;\n        }\n    }\n}\n`);

            const manifestPath = path.join(out, 'app/src/main/AndroidManifest.xml');
            let manifestXml = fs.readFileSync(manifestPath, 'utf8');
            const appMeta = `        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-4807272408824742~9880632781" />\n\n`;
            manifestXml = manifestXml.replace('    <application\n', '    <application\n');
            manifestXml = manifestXml.replace('        <meta-data\n            android:name="asset_statements"', appMeta + '        <meta-data\n            android:name="asset_statements"');
            const postMessageService = `\n        <service\n            android:name="androidx.browser.customtabs.PostMessageService"\n            android:exported="true" />\n`;
            manifestXml = manifestXml.replace('        <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />', postMessageService + '\n        <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />');
            fs.writeFileSync(manifestPath, manifestXml);

            const data = fs.readFileSync(path.join(out, 'twa-manifest.json'));
            fs.writeFileSync(path.join(out, 'manifest-checksum.txt'), crypto.createHash('sha1').update(data).digest('hex'));
            fs.rmSync(generationManifest, { force: true });
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Verify generated project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f android-generated/gradlew
          test -f android-generated/settings.gradle
          test -f android-generated/app/build.gradle
          test -f android-generated/app/src/main/AndroidManifest.xml
          test -f android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          grep -q 'versionName "1.3.6.3"' android-generated/app/build.gradle
          grep -q 'splashScreenFadeOutDuration: 0' android-generated/app/build.gradle
          grep -q 'minSdkVersion 23' android-generated/app/build.gradle
          grep -q 'play-services-ads:25.4.0' android-generated/app/build.gradle
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android-generated/app/src/main/AndroidManifest.xml
          grep -q 'PostMessageService' android-generated/app/src/main/AndroidManifest.xml
          grep -q 'STOP_AD_REQUEST_REWARDED' android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java
          ! grep -q 'splashScreenFadeOutDuration: ,' android-generated/app/build.gradle
          ! grep -q 'versionName ""' android-generated/app/build.gradle
          ! grep -q 'https://www.stopjuegodepalabras.comhttps://' android-generated/app/build.gradle
      - name: Build unsigned debug APK
        working-directory: android-generated
        run: ./gradlew assembleDebug --no-daemon
      - name: Remove generated build/cache files
        run: rm -rf android-generated/.gradle android-generated/app/build android-generated/build && rm -f android-generated/android-keystore
      - name: Commit generated Android project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-generated .github/workflows/generate-bubblewrap-android.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(android): add validated Bubblewrap project [skip android-generation]'
          git push origin HEAD:android/bubblewrap-admob
