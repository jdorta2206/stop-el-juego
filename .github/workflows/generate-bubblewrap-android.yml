name: Generate Bubblewrap Android project

on:
  push:
    branches: [android/bubblewrap-admob]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip android-generation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android/bubblewrap-admob
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Bubblewrap core
        run: npm install --no-save @bubblewrap/core@1.25.0
      - name: Generate TWA project without interactive prompts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-generated
          mkdir -p android-generated
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');
          (async () => {
            const out = path.resolve('android-generated');
            const manifest = await TwaManifest.fromFile(path.resolve('android/twa-manifest.json'));
            manifest.generatorApp = 'bubblewrap-cli';
            manifest.signingKey.path = path.join(out, 'android.keystore');
            await manifest.saveToFile(path.join(out, 'twa-manifest.json'));
            const generator = new TwaGenerator();
            await generator.createTwaProject(out, manifest);
            const data = fs.readFileSync(path.join(out, 'twa-manifest.json'));
            const crypto = require('crypto');
            fs.writeFileSync(path.join(out, 'manifest-checksum.txt'), crypto.createHash('sha1').update(data).digest('hex'));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Remove generated build/cache files
        run: rm -rf android-generated/.gradle android-generated/app/build android-generated/build && rm -f android-generated/android.keystore
      - name: Commit generated Android project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-generated .github/workflows/generate-bubblewrap-android.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(android): add generated Bubblewrap project [skip android-generation]'
          git push origin HEAD:android/bubblewrap-admob
