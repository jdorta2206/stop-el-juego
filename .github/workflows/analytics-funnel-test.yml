name: Analytics funnel regression test

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/routes/admin.ts"
      - "artifacts/api-server/src/routes/admin.funnel.test.ts"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/analytics-funnel-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run funnel regression test
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/admin.funnel.test.ts
