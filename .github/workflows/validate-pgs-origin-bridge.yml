name: Validate Play Games bridge origin

on:
  pull_request:
    branches: [master]
    paths:
      - "android-generated/**"
      - "scripts/build-pgs-android-browser-helper.sh"
      - "artifacts/stop-game/src/lib/twaPlayGamesBridge.ts"
      - ".github/workflows/validate-pgs-origin-bridge.yml"
  push:
    branches: [fix/pgs-validate-native-message-origin, fix/pgs-public-session-accessor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgs-origin-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify PGS origin and channel guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          web = Path("artifacts/stop-game/src/lib/twaPlayGamesBridge.ts").read_text()
          native = Path("android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java").read_text()
          assert 'const message = { type, ...extra, origin: window.location.origin };' in web
          assert 'if (!messageChannelReady || !relationshipValidated || !isAllowedOrigin(origin))' in native
          assert 'String origin = message.optString("origin", "");' in native
          assert 'STOP_PGS_UNLOCK_ACHIEVEMENT' in web and 'STOP_PGS_UNLOCK_ACHIEVEMENT' in native
          gradle = Path('android-generated/app/build.gradle').read_text()
          build_script = Path('scripts/build-pgs-android-browser-helper.sh').read_text()
          assert "implementation files('libs/androidbrowserhelper-release.aar')" in gradle
          assert 'febadb4dcdd7a66fb4d17175b67c012f245c8610' in build_script
          assert 'com.github.dnikolaev.android-browser-helper:androidbrowserhelper:' not in gradle
          assert 'getTwaSession()' in native
          assert 'return getCustomTabsSession();' in native
          assert 'findFieldValue(' not in native
          assert 'java.lang.reflect' not in native
          assert 'return "https://stopjuegodepalabras.com".equals(origin)' in native
          assert '|| "https://www.stopjuegodepalabras.com".equals(origin);' in native
          gradle = Path("android-generated/app/build.gradle").read_text()
          assert "versionCode 62" in gradle and 'versionName "1.3.7.6"' in gradle
          assert "postDelayed(this::requestUseAsOriginValidation, 1500L)" in native
          assert "STOP patch: retain this Activity and its CustomTabsSession" in build_script
          assert "mBrowserWasLaunched = true;" in build_script
          assert "callback_lines = [i for i, line in enumerate(lines)" in build_script
          assert "lines[index - 1].strip() != \"() -> {\"" in build_script
          assert "protected boolean shouldLaunchImmediately()" in native
          assert "return false;" in native[native.index("protected boolean shouldLaunchImmediately()"):native.index("protected void onCreate")]
          assert "launchTwaOnce();" in native
          assert "Starting startup sign-in while launcher is foregrounded" in native
          assert "schedulePlayGamesStartupSignIn" not in native
          print("PGS guards, foreground startup sign-in, session-retaining TWA lifecycle patch, and Android version code verified.")
          PY
      - name: Build pinned Android Browser Helper AAR
        run: bash scripts/build-pgs-android-browser-helper.sh
      - name: Compile Android debug APK
        working-directory: android-generated
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
