name: Validate Play Games bridge origin

on:
  pull_request:
    branches: [master]
    paths:
      - "android-generated/**"
      - "artifacts/stop-game/src/lib/twaPlayGamesBridge.ts"
      - ".github/workflows/validate-pgs-origin-bridge.yml"
  push:
    branches:
      - fix/pgs-validate-native-message-origin
      - fix/pgs-retain-launcher-session
      - fix/pgs-retain-launcher-session-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgs-origin-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify PGS origin and channel guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          web = Path("artifacts/stop-game/src/lib/twaPlayGamesBridge.ts").read_text()
          native = Path("android-generated/app/src/main/java/app/replit/stop_el_juego/twa/LauncherActivity.java").read_text()
          manifest = Path("android-generated/app/src/main/AndroidManifest.xml").read_text()
          assert 'const message = { type, ...extra, origin: window.location.origin };' in web
          assert 'if (!messageChannelReady || !relationshipValidated || !isAllowedOrigin(origin))' in native
          assert 'String origin = message.optString("origin", "");' in native
          assert 'STOP_PGS_UNLOCK_ACHIEVEMENT' in web and 'STOP_PGS_UNLOCK_ACHIEVEMENT' in native
          # Keep the launcher/session alive until Chrome reports the TWA session has ended.
          assert 'protected boolean shouldLaunchImmediately()' in native
          launch_gate = native.split("protected boolean shouldLaunchImmediately() {", 1)[1].split("}", 1)[0]
          assert "return false;" in launch_gate
          assert 'TwaProviderPicker.pickProvider(getPackageManager())' in native
          assert 'CustomTabsClient.bindCustomTabsService' in native
          assert 'client.warmup(0L)' in native
          assert 'warmupCustomTabsThenLaunchTwa();' in native
          assert 'isFinishing() || isDestroyed()' in native
          assert 'protected void launchTwa()' in native
          assert 'retainLauncherForTwa = true;' in native
          assert 'if (!retainLauncherForTwa || twaSessionEnded)' in native
          assert 'super.finish();' in native
          assert 'Retaining launcher until the TWA Custom Tabs session ends' in native
          finish_method = native.split("public void finish() {", 1)[1].split("\\n    @Override\\n    protected void onCreate", 1)[0]
          first_finish_guard = finish_method.split("if (!initialTwaFinishSuppressed) {", 1)[1].split("if (engagementSignalsRegistered || twaTabVisible)", 1)[0]
          assert "return;" in first_finish_guard and "super.finish();" not in first_finish_guard
          retained_finish_path = finish_method.split("if (!initialTwaFinishSuppressed) {", 1)[1]
          pre_timeout_finish = retained_finish_path.split("getWindow().getDecorView().postDelayed", 1)[0]
          assert "super.finish();" not in pre_timeout_finish
          assert finish_method.rindex("super.finish();") > finish_method.index("getWindow().getDecorView().postDelayed")
          assert 'EngagementSignalsCallback' in native
          assert 'isEngagementSignalsApiAvailable(Bundle.EMPTY)' in native
          assert 'setEngagementSignalsCallback(' in native
          assert 'onSessionEnded(boolean didUserInteract' in native
          assert 'finishAfterTwaSessionEnded(didUserInteract)' in native
          assert 'CustomTabsCallback.TAB_SHOWN' in native and 'CustomTabsCallback.TAB_HIDDEN' in native
          assert 'STOP_TWA_LIVENESS_PROBE' not in native and 'STOP_TWA_LIVENESS_PROBE' not in web
          assert 'android:configChanges="mcc|mnc|locale|touchscreen|keyboard|keyboardHidden|navigation|screenLayout|fontScale|fontWeightAdjustment|uiMode|orientation|screenSize|smallestScreenSize|density|layoutDirection|colorMode|grammaticalGender"' in manifest
          assert 'registerEngagementSignalsCallback();' in native and 'requestUseAsOriginValidation();' in native
          assert 'TWA CustomTabsSession unavailable for origin validation attempt=' in native
          # A manual sign-in request arriving during silent startup authentication must be queued.
          assert 'pendingInteractivePlayGamesSignIn = true;' in native
          assert 'playGamesSignInRequestedInteractive' in native
          assert 'startInteractivePlayGamesSignIn(signInGeneration);' in native
          assert 'Queued manual sign-in behind the startup authentication check' in native
          # PGS v2 startup stays silent; interactive sign-in is player-initiated.
          startup_branch = native.split('if ("STOP_PGS_STARTUP_READY".equals(type)) {', 1)[1].split('if ("STOP_PGS_SIGN_IN".equals(type)) {', 1)[0]
          manual_branch = native.split('if ("STOP_PGS_SIGN_IN".equals(type)) {', 1)[1].split('if ("STOP_PGS_STATUS".equals(type)) {', 1)[0]
          assert 'startPlayGamesSignInIfNeeded(false);' in startup_branch
          assert 'startPlayGamesSignInIfNeeded(true);' in manual_branch
          assert 'startPlayGamesSignInIfNeeded();' not in native
          assert 'return "https://stopjuegodepalabras.com".equals(origin)' in native
          assert '|| "https://www.stopjuegodepalabras.com".equals(origin);' in native
          print("PGS web origin payload and native TWA relationship/origin guards verified.")
          PY
      - name: Compile Android debug APK
        working-directory: android-generated
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
