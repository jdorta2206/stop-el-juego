name: DISABLED - android-v23-release-signed

# Legacy release workflow intentionally disabled.
# The only permitted Play Store AAB path is android-admob-release-aab.yml,
# which requires explicit confirmation and runs from master only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy workflow
        run: echo "This legacy Android release workflow is disabled; no APK or AAB is generated."
