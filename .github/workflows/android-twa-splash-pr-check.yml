name: Android TWA splash PR check

on:
  push:
    branches:
      - fix/android-twa-splash-self-uri-permission

permissions:
  contents: read

jobs:
  compile:
    name: Compile and package Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug Java sources
        working-directory: android-generated
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Assemble complete debug APK
        working-directory: android-generated
        run: ./gradlew --no-daemon :app:assembleDebug
