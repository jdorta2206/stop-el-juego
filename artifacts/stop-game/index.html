    <script>
      // JUGAR YA: never auto-start the match; the player must be able to choose Fácil/Experto.
      // Preserve every other query parameter (daily, mode, letter, cats, etc.).
      (function () {
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.get('auto') === '1') {
            u.searchParams.delete('auto');
            var q = u.searchParams.toString();
            window.history.replaceState({}, '', u.pathname + (q ? '?' + q : '') + u.hash);
          }
        } catch (_) {}
      })();
    </script>
