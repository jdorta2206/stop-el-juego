import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
}

def twaManifest = [
    applicationId: 'app.replit.stop_el_juego.twa', hostName: 'www.stopjuegodepalabras.com', launchUrl: '/?source=googleplay-twa&appVersion=1.3.6.9', name: 'STOP - El Juego', launcherName: 'STOP', 
    themeColor: '#0D1757', themeColorDark: '#000000', navigationColor: '#0D1757', navigationColorDark: '#0D1757', navigationDividerColor: '#0D1757', navigationDividerColorDark: '#0D1757', backgroundColor: '#0D1757',
    enableNotifications: true, shortcuts: [], splashScreenFadeOutDuration: 0, generatorApp: 'bubblewrap-cli', fallbackType: 'customtabs', enableSiteSettingsShortcut: false, orientation: 'portrait',
]
android {
    compileSdkVersion 36
    namespace "app.replit.stop_el_juego.twa"
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "app.replit.stop_el_juego.twa"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 54
        versionName "1.3.6.9"
        resValue "string", "appName", twaManifest.get('name')
        resValue "string", "launcherName", twaManifest.get('launcherName')
        def launchUrl = "https://" + twaManifest.get('hostName') + twaManifest.get('launchUrl')
        resValue "string", "launchUrl", launchUrl
        resValue "string", "webManifestUrl", 'https://www.stopjuegodepalabras.com/manifest.json'
        resValue "string", "fullScopeUrl", 'https://www.stopjuegodepalabras.com/'
        resValue "string", "hostName", twaManifest.get('hostName')
        resValue "color", "colorPrimary", twaManifest.get('themeColor')
        resValue "color", "colorPrimaryDark", twaManifest.get('themeColorDark')
        resValue "color", "navigationColor", twaManifest.get('navigationColor')
        resValue "color", "navigationColorDark", twaManifest.get('navigationColorDark')
        resValue "color", "navigationDividerColor", twaManifest.get('navigationDividerColor')
        resValue "color", "navigationDividerColorDark", twaManifest.get('navigationDividerColorDark')
        resValue "color", "backgroundColor", twaManifest.get('backgroundColor')
        resValue "string", "providerAuthority", twaManifest.get('applicationId') + '.fileprovider'
        resValue "bool", "enableNotification", twaManifest.get('enableNotifications').toString()
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.get('splashScreenFadeOutDuration').toString()
        resValue "string", "generatorApp", twaManifest.get('generatorApp')
        resValue "string", "fallbackType", twaManifest.get('fallbackType')
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.get('enableSiteSettingsShortcut').toString()
        resValue "string", "orientation", twaManifest.get('orientation')
    }
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('KEYSTORE_PASSWORD') && System.getenv('KEY_ALIAS') && System.getenv('KEY_PASSWORD')) {
        signingConfigs { ciRelease { storeFile file('../../android-release.keystore'); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') } }
        buildTypes.release.signingConfig signingConfigs.ciRelease
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lintOptions { checkReleaseBuilds false }
}
task generateShorcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")
    def xmlWriter = new StringWriter(); def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))
    xmlMarkup.'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
        twaManifest.shortcuts.eachWithIndex { s, i ->
            'shortcut'('android:shortcutId': 'shortcut' + i, 'android:enabled': 'true', 'android:icon': '@drawable/' + s.icon, 'android:shortcutShortLabel': '@string/shortcut_short_name_' + i, 'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                'intent'('android:action': 'android.intent.action.MAIN', 'android:targetPackage': twaManifest.get('applicationId'), 'android:targetClass': twaManifest.get('applicationId') + '.LauncherActivity', 'android:data': s.url)
                'categories'('android:name': 'android.intent.category.LAUNCHER')
            }
        }
    }
    shortcutsFile.text = xmlWriter.toString() + '\n'
}
preBuild.dependsOn(generateShorcutsFile)
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}
